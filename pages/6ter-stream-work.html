<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream4free Live - 6Ter</title>
  <meta name="description" content="6Ter, une chaine tv du groupe m6. Stream hd en direct">

  <link rel="stylesheet" href="https://vjs.zencdn.net/8.16.1/video-js.css">

  <style>
  * {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: #000;
  overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.player-page,
.player-shell {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
}

video {
  display: block;
  width: 100vw;
  height: 100vh;
  object-fit: fill;
  background: #000;
}
  
  
  
  </style>
</head>
<body>
  <main class="player-page">
    <div class="player-wrapper">
      <video
        id="live_player"
        class="video-js vjs-default-skin vjs-big-play-centered"
        controls
        autoplay
        playsinline
        preload="auto"
        poster="/images/playerbackground/6ter.jpg"
      >
        <source src="https://sv1.data-stream.top/93282c29d138a1f0aebe195fbbf1e353093d2ac27bb4d29dd4092543d0d5c05b/hls/6ter.m3u8" type="application/x-mpegURL">
        Ton navigateur ne peut pas lire cette vidéo.
      </video>
    </div>
  </main>

  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script>
    const player = videojs('live_player', {
      errorDisplay: false,
      liveui: true,
      fluid: true,
      responsive: true,
      controlBar: {
        pictureInPictureToggle: false
      }
    });

    const savedVolume = localStorage.getItem('videojs-user-volume');

    if (savedVolume !== null) {
      const volume = Number(savedVolume);
      if (!Number.isNaN(volume)) {
        player.volume(Math.min(Math.max(volume, 0), 1));
      }
    }

    player.on('volumechange', function () {
      localStorage.setItem('videojs-user-volume', String(player.volume()));
    });

    player.on('dblclick', function () {
      if (player.isFullscreen()) {
        player.exitFullscreen();
      } else {
        player.requestFullscreen();
      }
    });
  </script>
</body>
</html>
