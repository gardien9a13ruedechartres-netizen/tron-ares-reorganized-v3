<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">


<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#wrap{
    position:fixed;
    inset:0;
}

iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

#switchButton{
    position:fixed;
    top:12px;
    right:12px;
    z-index:9999;
    width:48px;
    height:48px;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    cursor:pointer;
}
</style>
</head>

<body>

<div id="wrap"></div>

<button id="switchButton">

</button>

<script>
const IFRAME_1_URL = 'https://worker-hls-player.victor-salema-53d.workers.dev/';
const IFRAME_2_URL = 'https://popcdn.day/player.php?stream=CMTVPT';

const wrap = document.getElementById('wrap');

let currentFrame = null;
let currentIndex = 1;

function createFrame(url){

    const iframe = document.createElement('iframe');

    iframe.allow =
        'autoplay; fullscreen; picture-in-picture; encrypted-media';

    iframe.allowFullscreen = true;

    iframe.referrerPolicy =
        'strict-origin-when-cross-origin';

    iframe.sandbox =
        'allow-scripts allow-same-origin allow-forms allow-presentation allow-popups';

    iframe.src = url;

    return iframe;
}

function destroyFrame(frame){

    if(!frame) return;

    try{

        /*
         Stop immédiat audio/video
        */
        frame.src = 'about:blank';

    }catch(e){}

    /*
     Retire du DOM
    */
    frame.remove();
}

function loadFrame(index){

    /*
     Détruit totalement l'ancienne iframe
    */
    destroyFrame(currentFrame);

    /*
     Choisit URL
    */
    const url =
        index === 1
        ? IFRAME_1_URL
        : IFRAME_2_URL;

    /*
     Crée nouvelle iframe
    */
    currentFrame = createFrame(url);

    /*
     Ajoute au DOM
    */
    wrap.appendChild(currentFrame);

    currentIndex = index;
}

/*
 Chargement initial
*/
loadFrame(1);

/*
 Switch
*/
document
.getElementById('switchButton')
.addEventListener('click',()=>{

    if(currentIndex === 1){

        loadFrame(2);

    }else{

        loadFrame(1);
    }
});
</script>
<script>
(function(){

    const BLOCKED_DOMAINS = [
        'chat.cfbu247.sbs',
        'tomompakis.shop',
        'hls-origin.streamserver.io',
        'ts-buffer.livestream.tv',
        'manifest-edge.videocdn.io',
        'media-delivery.cdn.com',
        'chunk-server.streamhub.net',
        'vidwestxyz.com',
        'youradexchange.com'
    ];

    const BLOCKED_PATTERNS = [
        'vidwestxyz.com',
        '.mp4',
        '/video/select.php',
        '/ingest/'
    ];

    function isBlocked(url){
        try{
            const u = new URL(url, location.href);
            const full = u.href.toLowerCase();
            const host = u.hostname.replace(/^www\./,'');

            if(
                BLOCKED_DOMAINS.some(domain =>
                    host === domain || host.endsWith('.' + domain)
                )
            ){
                return true;
            }

            return BLOCKED_PATTERNS.some(pattern =>
                full.includes(pattern)
            );

        }catch(e){
            return false;
        }
    }

    function killMediaElement(el){

        try{
            el.pause();
        }catch(e){}

        try{
            el.muted = true;
            el.volume = 0;
        }catch(e){}

        try{
            el.src = '';
            el.removeAttribute('src');
        }catch(e){}

        try{
            el.querySelectorAll('source').forEach(source => {
                source.src = '';
                source.removeAttribute('src');
                source.remove();
            });
        }catch(e){}

        try{
            el.load();
        }catch(e){}

        try{
            el.remove();
        }catch(e){}
    }

    function killIframe(frame){

        try{
            frame.src = 'about:blank';
        }catch(e){}

        try{
            frame.removeAttribute('src');
        }catch(e){}

        try{
            frame.remove();
        }catch(e){}
    }

    function cleanBlockedElements(){

        document.querySelectorAll('video,audio,source,iframe,img,script,link').forEach(el => {

            const src =
                el.src ||
                el.href ||
                el.currentSrc ||
                el.getAttribute('src') ||
                el.getAttribute('href') ||
                '';

            if(src && isBlocked(src)){

                console.warn('Élément bloqué supprimé:', src);

                if(el.tagName === 'VIDEO' || el.tagName === 'AUDIO'){
                    killMediaElement(el);
                    return;
                }

                if(el.tagName === 'IFRAME'){
                    killIframe(el);
                    return;
                }

                el.remove();
            }
        });
    }

    const originalFetch = window.fetch;

    window.fetch = function(resource, options){

        const url =
            typeof resource === 'string'
            ? resource
            : resource && resource.url;

        if(url && isBlocked(url)){
            console.warn('FETCH bloqué:', url);
            return Promise.reject(new Error('Requête bloquée'));
        }

        return originalFetch.apply(this, arguments);
    };

    const originalOpen = XMLHttpRequest.prototype.open;

    XMLHttpRequest.prototype.open = function(method, url){

        if(url && isBlocked(url)){
            console.warn('XHR bloqué:', url);
            this.abort();
            return;
        }

        return originalOpen.apply(this, arguments);
    };

    const originalSetAttribute = Element.prototype.setAttribute;

    Element.prototype.setAttribute = function(name, value){

        if(
            ['src','href'].includes(String(name).toLowerCase()) &&
            typeof value === 'string' &&
            isBlocked(value)
        ){
            console.warn('Attribut bloqué:', value);
            return;
        }

        return originalSetAttribute.apply(this, arguments);
    };

    function scanPerformance(){

        const entries = performance.getEntriesByType('resource');

        entries.forEach(entry => {

            if(entry.name && isBlocked(entry.name)){

                console.warn('Requête média suspecte détectée:', entry.name);

                document.querySelectorAll('video,audio').forEach(killMediaElement);

                document.querySelectorAll('iframe').forEach(frame => {
                    try{
                        if(frame.src && frame.src !== 'about:blank'){
                            killIframe(frame);
                        }
                    }catch(e){}
                });
            }
        });
    }

    const observer = new MutationObserver(() => {
        cleanBlockedElements();
    });

    observer.observe(document.documentElement, {
        childList:true,
        subtree:true,
        attributes:true,
        attributeFilter:['src','href']
    });

    setInterval(() => {
        cleanBlockedElements();
        scanPerformance();
    }, 500);

    document.addEventListener('play', function(e){
        const el = e.target;

        if(
            (el.tagName === 'VIDEO' || el.tagName === 'AUDIO') &&
            (
                isBlocked(el.src || '') ||
                isBlocked(el.currentSrc || '')
            )
        ){
            killMediaElement(el);
        }

    }, true);

    console.log('Anti-pub audio/vidéo actif');

})();
iframe.src = 'about:blank';
iframe.remove();
</script>

</body>
</html>
