<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#wrap{
    position:fixed;
    inset:0;
}

iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

.controlButton{
    position:fixed;
    z-index:9999;
    width:48px;
    height:48px;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:22px;
    line-height:1;
}

.controlButton:hover{
    background:rgba(255,255,255,.25);
}

#switchButton{
    top:12px;
    right:12px;
}

#refreshButton{
    top:12px;
    right:72px;
}

#playerBadge{
    position:fixed;
    top:72px;
    right:12px;
    z-index:9999;
    min-width:48px;
    height:28px;
    padding:0 10px;
    border-radius:999px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    user-select:none;
}

#switchButton::before{
    content:"⇄";
}

#refreshButton::before{
    content:"↻";
}
</style>
</head>

<body>

<div id="wrap"></div>

<button id="refreshButton" class="controlButton" title="Actualiser"></button>
<button id="switchButton" class="controlButton" title="Changer de lecteur"></button>
<div id="playerBadge" style="visibility: hidden;">1/3</div>

<script>
const IFRAME_1_URL = 'https://disney-channel.victor-salema-53d.workers.dev/?src=https://livewatch.top/api/hls?t=MTc4MTYxMjQxOXx8aHR0cHM6Ly90ZDN3YjFiY2hkdnNhaHAubmdvbHBka3lvY3RqY2RkeHNobGk0NjlyLm9yZy9zdW5zaGluZS92QTE4M3dpU3NmeWZnOFFBRkx0Sm8zREk5ZjY0d3FKOTVWMlp5Vkk4MGZrWndPU3hIRDViQktpVy12WFEzXzdYQmw0Q0toa29sN3dISWR5RmRhcEFWLXNhdlotZnhpZnZ0N1BFMXhRdmRaZk1oSGxjOVMyMlR0b1BobnFzZlBOX1NIRWdlUHFvM2lpdDc0WjVrc3NXU21fdzFhSFRXNHNwNkp4YnFIUmhGRmlSQ3lOSVlUSFFrc0REM2N6ME9ZeTBzQlRPSFBuOU5ScWR5aFU5d2lTN2VJNkZRdzUwVkFLWnVOM0JONVFtU2Q1alk5ZGhKYjVoS0V1dXFReTVxLU9QU1puUWlhSHIxN1JyRldSOGRXc3pSQS9obHMvaW5kZXgubTN1OHx8-qziqGMsFvc_bWf9_GtTkg';
const IFRAME_2_URL = 'https://popcdn.day/player.php?stream=CMTVPT';
const IFRAME_3_URL = '/pages/grrr.CM.html';

const PLAYERS = [
    IFRAME_1_URL,
    IFRAME_2_URL,
    IFRAME_3_URL
];

const wrap = document.getElementById('wrap');
const playerBadge = document.getElementById('playerBadge');

let currentFrame = null;
let currentIndex = 1;

function createFrame(url){

    const iframe = document.createElement('iframe');

    iframe.allow =
        'autoplay; fullscreen; picture-in-picture; encrypted-media';

    iframe.allowFullscreen = true;

    iframe.referrerPolicy =
        'strict-origin-when-cross-origin';

    iframe.sandbox =
        'allow-scripts allow-same-origin allow-forms allow-presentation allow-popups';

    iframe.src = url;

    return iframe;
}

function destroyFrame(frame){

    if(!frame) return;

    try{

        /*
         Stop immédiat audio/video
        */
        frame.src = 'about:blank';

    }catch(e){}

    /*
     Retire du DOM
    */
    frame.remove();
}

function normalizeIndex(index){

    const total = PLAYERS.length;

    if(index < 1) return total;
    if(index > total) return 1;

    return index;
}

function getCurrentUrl(){

    return PLAYERS[currentIndex - 1];
}

function updatePlayerBadge(){

    playerBadge.textContent = currentIndex + '/' + PLAYERS.length;
}

function loadFrame(index){

    /*
     Détruit totalement l'ancienne iframe
    */
    destroyFrame(currentFrame);

    /*
     Sécurise l'index demandé
    */
    currentIndex = normalizeIndex(index);

    /*
     Choisit URL
    */
    const url = getCurrentUrl();

    /*
     Crée nouvelle iframe
    */
    currentFrame = createFrame(url);

    /*
     Ajoute au DOM
    */
    wrap.appendChild(currentFrame);

    /*
     Met à jour l'indicateur
    */
    updatePlayerBadge();
}

function refreshCurrentFrame(){

    /*
     Recharge totalement l'iframe actuelle
     en la détruisant puis en la recréant
    */
    destroyFrame(currentFrame);

    currentFrame = createFrame(getCurrentUrl());

    wrap.appendChild(currentFrame);

    updatePlayerBadge();
}

/*
 Chargement initial
*/
loadFrame(1);

/*
 Switch 1 -> 2 -> 3 -> 1
*/
document
.getElementById('switchButton')
.addEventListener('click',()=>{

    loadFrame(currentIndex + 1);
});

/*
 Refresh
*/
document
.getElementById('refreshButton')
.addEventListener('click',()=>{

    refreshCurrentFrame();
});
</script>

</body>
</html>
