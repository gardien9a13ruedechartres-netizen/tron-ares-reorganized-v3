<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Player HLS CMTVPT</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background: #000;
    }
    #overlay {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      font-family: Arial, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 12px;
      line-height: 1.4;
    }
    #overlay.hidden { display: none; }
    button {
      margin-top: 8px;
      padding: 10px 14px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
    }
    code { word-break: break-all; color: #d7f7ff; }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
  <div id="overlay">
    <div><strong>Player HLS généré</strong></div>
    <div>URL ciblée : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="playBtn">Activer lecture avec son</button>
  </div>

  <script type="application/json" id="hls-data">{"url":"https://clouding.wideiptv.top/CMTVPT/index.fmp4.m3u8?token=1c9c5ffe3faf9a15b76b83237d4411dedd905429-6d78d24e67de50c5fd7096688e9dd074-1782417304-1782413704","urls":["https://clouding.wideiptv.top/CMTVPT/index.fmp4.m3u8?token=1c9c5ffe3faf9a15b76b83237d4411dedd905429-6d78d24e67de50c5fd7096688e9dd074-1782417304-1782413704"],"sourcePage":"https://gardien9a13ruedechartres-netizen.github.io/cmtv-chrome/","generatedAt":"2026-06-25T19:00:08.893Z"}</script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const dataNode = document.getElementById('hls-data');
    const HLS_DATA = JSON.parse(dataNode.textContent || '{}');
    const HLS_URL = String(HLS_DATA.url || '');
    const ALL_TARGET_URLS = Array.isArray(HLS_DATA.urls) ? HLS_DATA.urls : [];
    const SOURCE_PAGE = String(HLS_DATA.sourcePage || '');
    const GENERATED_AT = String(HLS_DATA.generatedAt || '');

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const playBtn = document.getElementById('playBtn');
    const urlLabel = document.getElementById('urlLabel');

    window.__CMTVPT_HLS_URL__ = HLS_URL;
    window.__CMTVPT_HLS_URLS__ = ALL_TARGET_URLS;
    window.__CMTVPT_SOURCE_PAGE__ = SOURCE_PAGE;
    window.__CMTVPT_GENERATED_AT__ = GENERATED_AT;

    urlLabel.textContent = HLS_URL || '(aucune URL)';
    video.muted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;
    video.style.objectFit = 'fill';

    let hls = null;
    let retryTimer = null;
    let watchdogTimer = null;
    let retryCount = 0;
    let lastGoodAt = Date.now();
    let lastTime = 0;
    let restarting = false;

    function setMessage(text) { msg.textContent = text; }
    function markGood() { lastGoodAt = Date.now(); }

    function showRetry(reason) {
      overlay.classList.remove('hidden');
      setMessage('Flux perdu ou instable. Relance invisible en cours... (' + reason + ') tentative ' + retryCount);
    }

    async function playWithSound() {
      try {
        video.muted = false;
        video.volume = 1;
        await video.play();
        markGood();
        overlay.classList.add('hidden');
      } catch (error) {
        overlay.classList.remove('hidden');
        setMessage('Lecture automatique avec son bloquée par le navigateur. Clique sur le bouton pour lancer. La reconnexion reste active.');
      }
    }

    function cleanupPlayer() {
      if (retryTimer) clearTimeout(retryTimer);
      retryTimer = null;
      if (hls) {
        try { hls.destroy(); } catch (_) {}
        hls = null;
      }
      try {
        video.pause();
        video.removeAttribute('src');
        video.load();
      } catch (_) {}
    }

    function attachSource() {
      if (!HLS_URL) {
        setMessage('Aucune URL HLS ciblée dans ce fichier.');
        return;
      }
      cleanupPlayer();
      restarting = false;
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          liveSyncDurationCount: 3,
          manifestLoadingTimeOut: 12000,
          fragLoadingTimeOut: 12000,
          levelLoadingTimeOut: 12000
        });
        hls.loadSource(HLS_URL);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          retryCount = 0;
          markGood();
          setMessage('Manifest HLS chargé. Tentative autoplay avec son...');
          playWithSound();
        });
        hls.on(Hls.Events.FRAG_LOADED, markGood);
        hls.on(Hls.Events.LEVEL_LOADED, markGood);
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.warn('Erreur HLS:', data);
          if (!data) return;
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR && hls) {
              try {
                hls.recoverMediaError();
                markGood();
                return;
              } catch (_) {}
            }
            scheduleInvisibleReload('erreur HLS fatale');
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = HLS_URL;
        video.addEventListener('loadedmetadata', () => { retryCount = 0; markGood(); playWithSound(); }, { once: true });
      } else {
        setMessage('HLS.js non chargé ou HLS non supporté par ce navigateur. Nouvelle tentative automatique...');
        scheduleInvisibleReload('hls.js indisponible');
      }
    }

    function scheduleInvisibleReload(reason) {
      if (!HLS_URL || restarting) return;
      restarting = true;
      retryCount += 1;
      const delay = Math.min(30000, 3000 + retryCount * 2000);
      showRetry(reason);
      console.warn('Relance invisible du flux dans ' + delay + ' ms. Raison:', reason);
      retryTimer = setTimeout(() => {
        restarting = false;
        attachSource();
      }, delay);
    }

    function startWatchdog() {
      if (watchdogTimer) clearInterval(watchdogTimer);
      watchdogTimer = setInterval(() => {
        if (!HLS_URL) return;
        const now = Date.now();
        const current = Number(video.currentTime || 0);
        const timeMoved = Math.abs(current - lastTime) > 0.2;
        if (timeMoved) {
          lastTime = current;
          markGood();
          return;
        }
        const noData = video.readyState < 2;
        const stuck = !video.paused && (now - lastGoodAt > 15000);
        const blocked = video.error || (noData && now - lastGoodAt > 12000);
        if (blocked || stuck) {
          scheduleInvisibleReload(video.error ? 'erreur vidéo' : (noData ? 'pas de données vidéo' : 'lecture bloquée'));
        }
      }, 5000);
    }

    ['playing','timeupdate','progress','canplay','loadeddata'].forEach(name => video.addEventListener(name, markGood));
    ['error','stalled','suspend','emptied','abort'].forEach(name => video.addEventListener(name, () => scheduleInvisibleReload('événement vidéo ' + name)));
    video.addEventListener('waiting', () => {
      setTimeout(() => {
        if (Date.now() - lastGoodAt > 12000) scheduleInvisibleReload('buffer trop long');
      }, 12000);
    });

    playBtn.addEventListener('click', playWithSound);
    attachSource();
    startWatchdog();

    console.log('URL HLS ciblée:', HLS_URL);
    console.log('Toutes les URLs ciblées:', ALL_TARGET_URLS.join('
'));
    console.log('Auto-reload invisible activé: relance HLS quand le flux tombe.');
  </script>
</body>
</html>
