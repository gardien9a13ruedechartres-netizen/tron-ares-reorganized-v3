<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#wrap{
    position:fixed;
    inset:0;
}

iframe,
video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    background:#000;
}

video{
    object-fit:fill;
}

#controls{
    position:fixed;
    top:0;
    right:0;
    z-index:9999;
    width:132px;
    height:72px;
}

.controlButton{
    position:absolute;
    z-index:9999;
    width:48px;
    height:48px;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:22px;
    line-height:1;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .2s ease, visibility .2s ease, background .2s ease;
}

#controls:hover .controlButton,
#controls:focus-within .controlButton{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.controlButton:hover{
    background:rgba(255,255,255,.25);
}

#switchButton{
    top:12px;
    right:12px;
}

#refreshButton{
    top:12px;
    right:72px;
}

#switchButton::before{
    content:"⇄";
}

#refreshButton::before{
    content:"↻";
}

#playerInfo{
    position:fixed;
    z-index:9999;
    top:72px;
    right:12px;
    min-width:48px;
    padding:7px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#fff;
    font-family:Arial, sans-serif;
    font-size:13px;
    text-align:center;
    user-select:none;
}

#message{
    position:fixed;
    inset:0;
    z-index:2;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:#fff;
    font-family:Arial, sans-serif;
    text-align:center;
    background:#000;
}

#message.visible{
    display:flex;
}

#messageBox{
    max-width:560px;
    padding:22px 24px;
    border-radius:18px;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

#messageBox strong{
    display:block;
    margin-bottom:10px;
    font-size:18px;
}

#messageBox span{
    display:block;
    font-size:14px;
    line-height:1.5;
    opacity:.9;
}
</style>
</head>

<body>

<div id="wrap"></div>
<div id="message">
    <div id="messageBox">
        <strong>Lecteur indisponible</strong>
        <span>Le lecteur actif ne répond pas.</span>
    </div>
</div>

<div id="controls">
    <button id="refreshButton" class="controlButton" title="Actualiser"></button>
    <button id="switchButton" class="controlButton" title="Changer de lecteur"></button>
</div>
<div id="playerInfo" style="visibility: hidden;">HLS 1/2</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const HLS_URL = 'https://tron-ares-iptv3.victor-salema-53d.workers.dev/api/iptv/live/cmtv/master.m3u8?skip=805844173b05e1a81e31d-579768661fe265';
const IFRAME_URL = 'https://player-engine.com/pages/worker-iptv3?channel=cmtv';

const STARTUP_TIMEOUT_MS = 15000;
const STALL_TIMEOUT_MS = 12000;
const FAILOVER_WINDOW_MS = 60000;
const MAX_AUTO_FAILOVERS_PER_WINDOW = 4;

const PLAYERS = [
    {
        type:'hls',
        label:'HLS 1/2',
        url:HLS_URL
    },
    {
        type:'iframe',
        label:'IFRAME 2/2',
        url:IFRAME_URL
    }
];

const wrap = document.getElementById('wrap');
const message = document.getElementById('message');
const messageTitle = message.querySelector('strong');
const messageText = message.querySelector('span');
const playerInfo = document.getElementById('playerInfo');

let currentElement = null;
let currentHls = null;
let currentIndex = 0;
let playerGeneration = 0;
let startupTimer = null;
let stallTimer = null;
let autoFailoverHistory = [];
let hlsNetworkRecoveryAttempts = 0;
let hlsMediaRecoveryAttempts = 0;

function showMessage(show, title = '', text = ''){
    if(title){
        messageTitle.textContent = title;
    }

    if(text){
        messageText.textContent = text;
    }

    if(show){
        message.classList.add('visible');
    }else{
        message.classList.remove('visible');
    }
}

function clearTimers(){
    if(startupTimer){
        clearTimeout(startupTimer);
        startupTimer = null;
    }

    if(stallTimer){
        clearTimeout(stallTimer);
        stallTimer = null;
    }
}

function clearStartupTimer(){
    if(startupTimer){
        clearTimeout(startupTimer);
        startupTimer = null;
    }
}

function clearStallTimer(){
    if(stallTimer){
        clearTimeout(stallTimer);
        stallTimer = null;
    }
}

function isCurrentGeneration(generation){
    return generation === playerGeneration;
}

function pruneFailoverHistory(){
    const cutoff = Date.now() - FAILOVER_WINDOW_MS;

    autoFailoverHistory = autoFailoverHistory.filter(
        timestamp => timestamp >= cutoff
    );
}

function stopAutoFailoverLoop(){
    clearTimers();

    showMessage(
        true,
        'Les deux lecteurs semblent indisponibles',
        'La bascule automatique a été arrêtée temporairement pour éviter une boucle infinie. Utilise Actualiser ou Changer de lecteur pour relancer.'
    );
}

function autoFailover(reason, generation){
    if(!isCurrentGeneration(generation)){
        return;
    }

    pruneFailoverHistory();

    if(autoFailoverHistory.length >= MAX_AUTO_FAILOVERS_PER_WINDOW){
        stopAutoFailoverLoop();
        return;
    }

    autoFailoverHistory.push(Date.now());

    const nextIndex = (currentIndex + 1) % PLAYERS.length;

    console.warn(
        '[Auto failover]',
        PLAYERS[currentIndex].label,
        '->',
        PLAYERS[nextIndex].label,
        '| raison:',
        reason
    );

    loadPlayer(nextIndex, true);
}

function startStartupWatchdog(generation, label){
    clearStartupTimer();

    startupTimer = setTimeout(()=>{
        autoFailover(
            'délai de démarrage dépassé pour ' + label,
            generation
        );
    }, STARTUP_TIMEOUT_MS);
}

function startStallWatchdog(generation, reason){
    if(stallTimer){
        return;
    }

    stallTimer = setTimeout(()=>{
        stallTimer = null;
        autoFailover(reason, generation);
    }, STALL_TIMEOUT_MS);
}

function createFrame(url, generation){
    const iframe = document.createElement('iframe');

    iframe.allow =
        'autoplay; fullscreen; picture-in-picture; encrypted-media';

    iframe.allowFullscreen = true;

    iframe.referrerPolicy =
        'strict-origin-when-cross-origin';

    iframe.sandbox =
        'allow-scripts allow-same-origin allow-forms allow-presentation allow-popups';

    iframe.addEventListener('load',()=>{
        if(!isCurrentGeneration(generation)){
            return;
        }

        clearStartupTimer();
    });

    iframe.addEventListener('error',()=>{
        autoFailover('erreur de chargement de l’iframe', generation);
    });

    iframe.src = url;

    startStartupWatchdog(generation, PLAYERS[currentIndex].label);

    return iframe;
}

function attachVideoHealthEvents(video, generation){
    const markPlaying = ()=>{
        if(!isCurrentGeneration(generation)){
            return;
        }

        clearStartupTimer();
        clearStallTimer();
    };

    const markStalled = ()=>{
        if(!isCurrentGeneration(generation)){
            return;
        }

        startStallWatchdog(
            generation,
            'lecture bloquée pendant plus de ' + (STALL_TIMEOUT_MS / 1000) + ' secondes'
        );
    };

    video.addEventListener('playing', markPlaying);
    video.addEventListener('canplay', markPlaying);
    video.addEventListener('timeupdate', markPlaying);
    video.addEventListener('waiting', markStalled);
    video.addEventListener('stalled', markStalled);

    video.addEventListener('error',()=>{
        autoFailover('erreur vidéo', generation);
    });

    video.addEventListener('ended',()=>{
        autoFailover('fin inattendue du flux vidéo', generation);
    });
}

function createHlsPlayer(url, generation){
    const video = document.createElement('video');

    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.muted = false;

    attachVideoHealthEvents(video, generation);
    startStartupWatchdog(generation, PLAYERS[currentIndex].label);

    if(!url || url === 'stream.m3u8'){
        autoFailover('URL HLS non configurée', generation);
        return video;
    }

    if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src = url;

        video.addEventListener('loadedmetadata',()=>{
            if(!isCurrentGeneration(generation)){
                return;
            }

            video.play().catch(()=>{});
        });
    }else if(window.Hls && Hls.isSupported()){
        currentHls = new Hls({
            enableWorker:true,
            lowLatencyMode:true
        });

        currentHls.loadSource(url);
        currentHls.attachMedia(video);

        currentHls.on(Hls.Events.MANIFEST_PARSED,()=>{
            if(!isCurrentGeneration(generation)){
                return;
            }

            video.play().catch(()=>{});
        });

        currentHls.on(Hls.Events.ERROR,(_event, data)=>{
            if(!isCurrentGeneration(generation) || !data.fatal){
                return;
            }

            if(data.type === Hls.ErrorTypes.NETWORK_ERROR &&
               hlsNetworkRecoveryAttempts < 1){
                hlsNetworkRecoveryAttempts += 1;

                try{
                    currentHls.startLoad();
                    return;
                }catch(e){}
            }

            if(data.type === Hls.ErrorTypes.MEDIA_ERROR &&
               hlsMediaRecoveryAttempts < 1){
                hlsMediaRecoveryAttempts += 1;

                try{
                    currentHls.recoverMediaError();
                    return;
                }catch(e){}
            }

            autoFailover(
                'erreur HLS fatale : ' + (data.details || data.type || 'inconnue'),
                generation
            );
        });
    }else{
        autoFailover('HLS non supporté par ce navigateur', generation);
    }

    return video;
}

function destroyCurrentElement(){
    clearTimers();

    if(currentHls){
        try{
            currentHls.destroy();
        }catch(e){}

        currentHls = null;
    }

    if(!currentElement){
        return;
    }

    try{
        if(currentElement.tagName === 'IFRAME'){
            currentElement.src = 'about:blank';
        }

        if(currentElement.tagName === 'VIDEO'){
            currentElement.pause();
            currentElement.removeAttribute('src');
            currentElement.load();
        }
    }catch(e){}

    currentElement.remove();
    currentElement = null;
}

function loadPlayer(index, automatic = false){
    playerGeneration += 1;

    const generation = playerGeneration;

    destroyCurrentElement();
    showMessage(false);

    currentIndex = index;

    const player = PLAYERS[index];
    let nextElement = null;

    hlsNetworkRecoveryAttempts = 0;
    hlsMediaRecoveryAttempts = 0;

    if(!automatic){
        autoFailoverHistory = [];
    }

    if(player.type === 'iframe'){
        nextElement = createFrame(player.url, generation);
    }

    if(player.type === 'hls'){
        nextElement = createHlsPlayer(player.url, generation);
    }

    if(!isCurrentGeneration(generation) || !nextElement){
        try{
            nextElement?.remove();
        }catch(e){}

        return;
    }

    currentElement = nextElement;
    wrap.appendChild(currentElement);
    playerInfo.textContent = player.label;
}

function refreshCurrentPlayer(){
    loadPlayer(currentIndex, false);
}

function switchPlayer(){
    const nextIndex = (currentIndex + 1) % PLAYERS.length;
    loadPlayer(nextIndex, false);
}

loadPlayer(0, false);

document
.getElementById('switchButton')
.addEventListener('click',()=>{
    switchPlayer();
});

document
.getElementById('refreshButton')
.addEventListener('click',()=>{
    refreshCurrentPlayer();
});
</script>

</body>
</html>
