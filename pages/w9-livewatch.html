<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W9</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stage,
    .frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    .frame {
      border: 0;
      display: block;
    }
    .toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 30;
      width: 42px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 8px;
      background: rgba(0, 0, 0, .5);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .panel {
      position: fixed;
      top: 54px;
      right: 10px;
      z-index: 30;
      width: min(330px, calc(100vw - 20px));
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 8px;
      background: rgba(4, 7, 12, .88);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .5);
    }
    .panel.hidden { display: none; }
    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .source,
    .open {
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 7px;
      background: #101827;
      color: #e6edf8;
      font-weight: 800;
      cursor: pointer;
    }
    .source.active {
      background: #0ea5e9;
      border-color: #7dd3fc;
      color: #03131d;
    }
    .open {
      width: 100%;
      margin-top: 8px;
      background: #243044;
    }
    .status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 20;
      max-width: min(680px, calc(100vw - 20px));
      padding: 8px 10px;
      border-radius: 7px;
      background: rgba(0, 0, 0, .55);
      color: #dbeafe;
      font-size: 13px;
      line-height: 1.35;
      pointer-events: none;
      opacity: .9;
      transition: opacity .25s ease;
    }
    .status.fade { opacity: 0; }
  </style>
</head>
<body>
  <main class="stage">
    <iframe
      id="liveFrame"
      class="frame"
      title="W9"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen
      referrerpolicy="no-referrer">
    </iframe>
  </main>

  <button id="toggle" class="toggle" type="button" title="Sources">☰</button>
  <section id="panel" class="panel hidden">
    <div class="buttons">
      <button class="source" type="button" data-source="basic">BASIC HD</button>
      <button class="source" type="button" data-source="satellite">SAT HD</button>
      <button class="source" type="button" data-source="cable">CABLE</button>
      <button class="source" type="button" data-source="player">PLAYER</button>
    </div>
    <button id="openDirect" class="open" type="button">OUVRIR DIRECT</button>
  </section>
  <div id="status" class="status">W9 basic HD</div>

  <script>
    (() => {
      const sources = {
        basic: {
          label: 'W9 basic HD',
          url: 'https://livewatch.top/embed/12804661554f36ca1095a-36724fff9f173c'
        },
        satellite: {
          label: 'W9 satellite HD',
          url: 'https://livewatch.top/embed/338554998683e8b650775f-03d803b21aa717'
        },
        cable: {
          label: 'W9 cable',
          url: 'https://livewatch.top/embed/280062836403e9b757ac4c-427ac871825faa'
        },
        player: {
          label: 'W9 player',
          url: 'https://livewatch.top/player?url=vavoo_W9%2520HD%7Cgroup%3Afr'
        }
      };

      const frame = document.getElementById('liveFrame');
      const panel = document.getElementById('panel');
      const toggle = document.getElementById('toggle');
      const statusBox = document.getElementById('status');
      const openDirect = document.getElementById('openDirect');
      const buttons = Array.from(document.querySelectorAll('.source'));

      let activeSource = new URLSearchParams(location.search).get('source') ||
        localStorage.getItem('ares-w9-livewatch-source') ||
        'basic';

      if (!sources[activeSource]) activeSource = 'basic';

      function setStatus(message, keepVisible) {
        statusBox.textContent = message;
        statusBox.classList.remove('fade');
        if (!keepVisible) {
          window.clearTimeout(setStatus.timer);
          setStatus.timer = window.setTimeout(() => statusBox.classList.add('fade'), 3500);
        }
      }

      function setActiveButton(source) {
        buttons.forEach(button => {
          button.classList.toggle('active', button.dataset.source === source);
        });
      }

      function loadSource(source) {
        const item = sources[source] || sources.basic;
        activeSource = sources[source] ? source : 'basic';
        localStorage.setItem('ares-w9-livewatch-source', activeSource);
        setActiveButton(activeSource);
        setStatus(item.label, false);
        frame.src = item.url + (item.url.includes('?') ? '&' : '?') + '_ares=' + Date.now();
      }

      toggle.addEventListener('click', () => {
        panel.classList.toggle('hidden');
      });

      buttons.forEach(button => {
        button.addEventListener('click', () => {
          loadSource(button.dataset.source);
          panel.classList.add('hidden');
        });
      });

      openDirect.addEventListener('click', () => {
        window.open((sources[activeSource] || sources.basic).url, '_blank', 'noopener,noreferrer');
      });

      frame.addEventListener('load', () => {
        setStatus((sources[activeSource] || sources.basic).label, false);
      });

      loadSource(activeSource);
    })();
  </script>
</body>
</html>
