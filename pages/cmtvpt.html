<head>

</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline webkit-playsinline controls></video>
</div>
<div id="panel">
  <h1>Player HLS CMTVPT</h1>
  <div>URL ciblee : <span id="urlText"></span></div>
  <div>Reference : <span id="refText"></span></div>
  <div>Genere : <span id="genText"></span></div>
  <div id="status">Initialisation...</div>
  <button id="startBtn">Activer lecture avec son</button>
</div>
<script id="ares-player-data" type="application/json">{"channel":"CMTVPT","masterUrl":"https://clouding.wideiptv.top/CMTVPT/index.fmp4.m3u8?token=be1750b10b6ceaac5c87bacff704b65010a5d09e-2942346893fc61a3e388c73020e2e241-1782504239-1782500639","ref":"1782500639","generatedAt":"2026-06-26T19:11:25.520Z","generator":"URL Capture CMTVPT Pro v2.0"}</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(function(){
  'use strict';
  const data = JSON.parse(document.getElementById('ares-player-data').textContent);
  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  document.getElementById('urlText').textContent = data.masterUrl;
  document.getElementById('refText').textContent = data.ref || '-';
  document.getElementById('genText').textContent = data.generatedAt;

  let hls = null;
  function setStatus(text){ status.textContent = text; }
  function showButton(text){ startBtn.textContent = text; startBtn.style.display = 'inline-block'; }
  function hideButton(){ startBtn.style.display = 'none'; }

  async function tryPlay(withSound){
    try {
      video.muted = !withSound;
      video.volume = withSound ? 1 : 0;
      await video.play();
      hideButton();
      setStatus(withSound ? 'Lecture active avec son.' : 'Lecture active en muet. Clique pour activer le son si besoin.');
      if (!withSound) showButton('Activer lecture avec son');
    } catch (e) {
      setStatus('Lecture bloquee par le navigateur. Action utilisateur requise.');
      showButton('Activer lecture avec son');
    }
  }

  function attachHls(){
    setStatus('Chargement HLS...');
    if (window.Hls && window.Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 30
      });
      hls.loadSource(data.masterUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){
        setStatus('Manifest HLS charge. Demarrage...');
        tryPlay(true).catch(function(){});
      });
      hls.on(Hls.Events.ERROR, function(evt, info){
        if (info && info.fatal) {
          setStatus('Erreur HLS fatale. Verifie que l URL est encore valide.');
          showButton('Reessayer lecture');
        }
      });
      return;
    }

    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = data.masterUrl;
      video.addEventListener('loadedmetadata', function(){ tryPlay(true).catch(function(){}); }, { once:true });
      return;
    }

    video.src = data.masterUrl;
    setStatus('HLS.js non disponible. Tentative native...');
    tryPlay(true).catch(function(){});
  }

  startBtn.addEventListener('click', function(){
    if (hls && hls.media !== video) hls.attachMedia(video);
    tryPlay(true).catch(function(){});
  });

  attachHls();
  console.log('URL HLS ciblee:', data.masterUrl);
})();
</script>
</body>
