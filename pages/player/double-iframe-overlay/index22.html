<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Double iframe overlay</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .player {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .frame-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      background: #000;
    }

    .frame-wrap.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      object-fit: fill;
      background: #000;
    }

    .switch-button {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.88);
      color: #000;
      font-size: 24px;
      line-height: 54px;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .switch-button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <main class="player">
    <div id="wrap1" class="frame-wrap active">
      <iframe
        id="iframe1"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        allowfullscreen
        src="https://player-engine.com/pages/cmtv2.html">
      </iframe>
    </div>

    <div id="wrap2" class="frame-wrap">
      <iframe
        id="iframe2"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        allowfullscreen
        src="https://livewatch.top/embed/384601660517fa3552a29f-6816b5893e5bcc">
      </iframe>
    </div>
  </main>

  <button id="switchButton" class="switch-button" type="button" aria-label="Changer d'iframe">⇄</button>

  <script>
    const IFRAME_1_URL = 'https://player-engine.com/pages/cmtv2.html';
    const IFRAME_2_URL = 'https://livewatch.top/embed/384601660517fa3552a29f-6816b5893e5bcc';

    const wrap1 = document.getElementById('wrap1');
    const wrap2 = document.getElementById('wrap2');
    const iframe1 = document.getElementById('iframe1');
    const iframe2 = document.getElementById('iframe2');
    const switchButton = document.getElementById('switchButton');

    let activeFrame = 1;

    iframe1.src = withPlayerApi(IFRAME_1_URL);
    iframe2.src = withPlayerApi(IFRAME_2_URL);

    function withPlayerApi(url) {
      if (!url || url === 'about:blank') return url;

      try {
        const parsedUrl = new URL(url, window.location.href);

        if (parsedUrl.hostname.includes('youtube.com') || parsedUrl.hostname.includes('youtube-nocookie.com')) {
          parsedUrl.searchParams.set('enablejsapi', '1');
          parsedUrl.searchParams.set('playsinline', '1');
        }

        return parsedUrl.toString();
      } catch (error) {
        return url;
      }
    }

    function postToIframe(iframe, message) {
      if (!iframe || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage(JSON.stringify(message), '*');
    }

    function muteIframe(iframe) {
      postToIframe(iframe, {
        event: 'command',
        func: 'mute',
        args: []
      });
    }

    function unmuteIframe(iframe) {
      postToIframe(iframe, {
        event: 'command',
        func: 'unMute',
        args: []
      });
    }

    function pauseIframe(iframe) {
      postToIframe(iframe, {
        event: 'command',
        func: 'pauseVideo',
        args: []
      });
    }

    function playIframe(iframe) {
      postToIframe(iframe, {
        event: 'command',
        func: 'playVideo',
        args: []
      });
    }

    function applyActiveFrame() {
      const currentWrap = activeFrame === 1 ? wrap1 : wrap2;
      const hiddenWrap = activeFrame === 1 ? wrap2 : wrap1;
      const currentIframe = activeFrame === 1 ? iframe1 : iframe2;
      const hiddenIframe = activeFrame === 1 ? iframe2 : iframe1;

      currentWrap.classList.add('active');
      hiddenWrap.classList.remove('active');

      muteIframe(hiddenIframe);
      pauseIframe(hiddenIframe);
      unmuteIframe(currentIframe);
      playIframe(currentIframe);
    }

    switchButton.addEventListener('click', function () {
      activeFrame = activeFrame === 1 ? 2 : 1;
      applyActiveFrame();
    });

    window.addEventListener('load', applyActiveFrame);
  </script>
</body>
</html>
