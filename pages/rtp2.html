<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Player HLS RTP2</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background: #000;
    }
    #overlay {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      font-family: Arial, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 12px;
      line-height: 1.4;
    }
    #overlay.hidden { display: none; }
    button {
      margin-top: 8px;
      padding: 10px 14px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
    }
    code { word-break: break-all; color: #d7f7ff; }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
  <div id="overlay">
    <div><strong>Player HLS généré</strong></div>
    <div>URL ciblée : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="playBtn">Activer lecture avec son</button>
  </div>

  <script type="application/json" id="hls-data">{"url":"https://player-engine.com/api/cmtvpt/proxy?url=https%3A%2F%2Fclouding.wideiptv.top%2FRTP2%2Findex.fmp4.m3u8%3Ftoken%3D8df540d531c155d01e882fb373276cd3d4bf3020-f4874f188ca1dec042c1ac893f4fcfaf-1782632690-1782629090","upstreamUrl":"https://clouding.wideiptv.top/RTP2/index.fmp4.m3u8?token=8df540d531c155d01e882fb373276cd3d4bf3020-f4874f188ca1dec042c1ac893f4fcfaf-1782632690-1782629090","urls":["https://clouding.wideiptv.top/RTP2/index.fmp4.m3u8?token=8df540d531c155d01e882fb373276cd3d4bf3020-f4874f188ca1dec042c1ac893f4fcfaf-1782632690-1782629090"],"sourcePage":"https://popcdn.day/player.php?stream=RTP2","generatedAt":"2026-06-28T06:49:50.845Z"}</script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  <script>
    const dataNode = document.getElementById('hls-data');
    const HLS_DATA = JSON.parse(dataNode.textContent || '{}');
    let HLS_URL = String(HLS_DATA.url || '');
    const ALL_TARGET_URLS = Array.isArray(HLS_DATA.urls) ? HLS_DATA.urls : [];
    const SOURCE_PAGE = String(HLS_DATA.sourcePage || '');
    const GENERATED_AT = String(HLS_DATA.generatedAt || '');

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const playBtn = document.getElementById('playBtn');
    const urlLabel = document.getElementById('urlLabel');
    let hlsInstance = null;
    let retryTimer = null;
    let retryDelayMs = 3000;

    window.__CHANNEL_HLS_URL__ = HLS_URL;
    window.__CHANNEL_HLS_URLS__ = ALL_TARGET_URLS;
    window.__CHANNEL_SOURCE_PAGE__ = SOURCE_PAGE;
    window.__CHANNEL_GENERATED_AT__ = GENERATED_AT;

    urlLabel.textContent = HLS_URL || '(aucune URL)';
    video.muted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;
    video.style.objectFit = 'fill';

    function setMessage(text) { msg.textContent = text; }

    async function playWithSound() {
      try {
        video.muted = false;
        video.volume = 1;
        await video.play();
        overlay.classList.add('hidden');
      } catch (error) {
        overlay.classList.remove('hidden');
        setMessage('Lecture automatique avec son bloquée par le navigateur. Clique sur le bouton pour lancer.');
      }
    }

    function scheduleRecovery() {
      if (retryTimer) return;
      const delay = retryDelayMs;
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
      setMessage('Flux temporairement indisponible. Nouvelle tentative...');
      retryTimer = setTimeout(() => {
        retryTimer = null;
        attachSource(HLS_URL);
      }, delay);
    }

    function attachSource(nextUrl = HLS_URL) {
      HLS_URL = String(nextUrl || '');
      window.__CHANNEL_HLS_URL__ = HLS_URL;
      urlLabel.textContent = HLS_URL || '(aucune URL)';
      if (!HLS_URL) {
        setMessage('Aucune URL HLS ciblée dans ce fichier.');
        return;
      }
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(HLS_URL);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          retryDelayMs = 3000;
          if (retryTimer) {
            clearTimeout(retryTimer);
            retryTimer = null;
          }
          setMessage('Manifest HLS chargé. Tentative autoplay avec son...');
          playWithSound();
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          console.warn('Erreur HLS:', data);
          if (data && data.fatal) scheduleRecovery();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = HLS_URL;
        video.addEventListener('loadedmetadata', playWithSound, { once: true });
      } else {
        setMessage('HLS.js non chargé ou HLS non supporté par ce navigateur.');
      }
    }

    async function refreshPublishedSource() {
      if (!/^https?:$/.test(location.protocol)) return;
      try {
        const refreshUrl = new URL(location.href);
        refreshUrl.searchParams.set('_hls_refresh', String(Date.now()));
        const response = await fetch(refreshUrl, { cache: 'no-store' });
        if (!response.ok) return;
        const nextDocument = new DOMParser().parseFromString(await response.text(), 'text/html');
        const nextDataNode = nextDocument.getElementById('hls-data');
        if (!nextDataNode) return;
        const nextData = JSON.parse(nextDataNode.textContent || '{}');
        const nextUrl = String(nextData.url || '');
        if (nextUrl && nextUrl !== HLS_URL) {
          setMessage('Nouveau master detecte. Mise a jour du flux...');
          attachSource(nextUrl);
        }
      } catch (error) {
        console.warn('Verification du nouveau master impossible:', error);
      }
    }

    playBtn.addEventListener('click', playWithSound);
    attachSource();
    setInterval(refreshPublishedSource, 20000);

    console.log('URL HLS ciblée:', HLS_URL);
    console.log('Toutes les URLs ciblées:', ALL_TARGET_URLS.join('\n'));
  </script>
</body>
</html>
