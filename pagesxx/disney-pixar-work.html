<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#wrap{position:fixed;inset:0}
iframe{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
object-fit:fill;
visibility:hidden;
}
iframe.active{
visibility:visible;
}
#switchButton{
position:fixed;
top:12px;
right:12px;
z-index:9999;
width:42px;
height:42px;
border:0;
background:rgba(255,255,255,.12);
border-radius:999px;
}
</style>
</head>
<body>

<div id="wrap"></div>
<button id="switchButton"></button>

<script>
const IFRAME_1_URL='https://livewatch.top/embed/1616464273e04bb68a8a1c-ed3fcb510db31f';
const IFRAME_2_URL='https://livewatch.top/embed/1616464273e04bb68a8a1c-ed3fcb510db31f';

const wrap=document.getElementById('wrap');

function create(url){
 const f=document.createElement('iframe');
 f.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';
 f.allowFullscreen=true;
 f.referrerPolicy='strict-origin-when-cross-origin';
 f.sandbox='allow-scripts allow-same-origin allow-forms allow-presentation allow-popups';
 f.src=url;
 return f;
}

let a=create(IFRAME_1_URL);
let b=create(IFRAME_2_URL);

wrap.append(a,b);

a.classList.add('active');

function hardStop(frame){
 try{
   frame.src='about:blank';
 }catch(e){}
}

function revive(frame,url){
 const fresh=create(url);
 wrap.replaceChild(fresh,frame);
 return fresh;
}

document.getElementById('switchButton').onclick=()=>{

 if(a.classList.contains('active')){

    hardStop(a);

    a.classList.remove('active');

    b=revive(b,IFRAME_2_URL);

    b.classList.add('active');

 }else{

    hardStop(b);

    b.classList.remove('active');

    a=revive(a,IFRAME_1_URL);

    a.classList.add('active');
 }
};
</script>

</body>
</html>
