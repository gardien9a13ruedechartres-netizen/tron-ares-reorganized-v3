<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Player HLS RTP2</title>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; }
    video { position:fixed; inset:0; width:100vw; height:100vh; object-fit:fill; background:#000; }
    #overlay { position:fixed; left:16px; right:16px; bottom:16px; z-index:10; font-family:Arial,sans-serif; color:#fff; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:12px; line-height:1.4; }
    #overlay.hidden { display:none; }
    button { margin-top:8px; padding:10px 14px; cursor:pointer; border:0; border-radius:8px; font-weight:700; }
    code { word-break:break-all; color:#d7f7ff; }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
  <div id="overlay">
    <div><strong>Player HLS RTP2</strong></div>
    <div>URL ciblée : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="playBtn">Activer lecture avec son</button>
  </div>
  <script type="application/json" id="hls-data">{"url":"https://clouding.wideiptv.top/RTP2/index.fmp4.m3u8?token=3db33a31c1d98b1759a10e65b4c41d4b1b17d121-6ad01f89b2bf9e068082fff765af66a6-1782457570-1782453970","urls":["https://clouding.wideiptv.top/RTP2/index.fmp4.m3u8?token=3db33a31c1d98b1759a10e65b4c41d4b1b17d121-6ad01f89b2bf9e068082fff765af66a6-1782457570-1782453970"],"sourcePage":"https://www.freeshot.live/live-tv/rtp-2/234","generatedAt":"2026-06-26T06:11:19.009Z","target":"RTP2"}</script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const dataNode = document.getElementById('hls-data');
    const HLS_DATA = JSON.parse(dataNode.textContent || '{}');
    const HLS_URL = String(HLS_DATA.url || '');
    const ALL_TARGET_URLS = Array.isArray(HLS_DATA.urls) ? HLS_DATA.urls : [];
    const SOURCE_PAGE = String(HLS_DATA.sourcePage || '');
    const GENERATED_AT = String(HLS_DATA.generatedAt || '');
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const playBtn = document.getElementById('playBtn');
    const urlLabel = document.getElementById('urlLabel');
    window.__RTP2_HLS_URL__ = HLS_URL;
    window.__RTP2_HLS_URLS__ = ALL_TARGET_URLS;
    window.__RTP2_SOURCE_PAGE__ = SOURCE_PAGE;
    window.__RTP2_GENERATED_AT__ = GENERATED_AT;
    urlLabel.textContent = HLS_URL || '(aucune URL)';
    video.muted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;
    video.style.objectFit = 'fill';
    function setMessage(text){ msg.textContent = text; }
    async function playWithSound(){
      try { video.muted = false; video.volume = 1; await video.play(); overlay.classList.add('hidden'); }
      catch(error){ overlay.classList.remove('hidden'); setMessage('Lecture automatique avec son bloquée par le navigateur. Clique sur le bouton pour lancer.'); }
    }
    function attachSource(){
      if(!HLS_URL){ setMessage('Aucune URL HLS ciblée dans ce fichier.'); return; }
      if(window.Hls && Hls.isSupported()){
        const hls = new Hls({ enableWorker:true, lowLatencyMode:true });
        hls.loadSource(HLS_URL);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { setMessage('Manifest HLS chargé. Tentative autoplay avec son...'); playWithSound(); });
        hls.on(Hls.Events.ERROR, (event, data) => { console.warn('Erreur HLS:', data); if(data && data.fatal) setMessage('Erreur HLS fatale. Vérifie que l’URL est encore valide.'); });
      } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = HLS_URL;
        video.addEventListener('loadedmetadata', playWithSound, { once:true });
      } else {
        setMessage('HLS.js non chargé ou HLS non supporté par ce navigateur.');
      }
    }
    playBtn.addEventListener('click', playWithSound);
    attachSource();
    console.log('URL HLS ciblée RTP2:', HLS_URL);
    console.log('Toutes les URLs ciblées RTP2:', ALL_TARGET_URLS.join('\n'));
  </script>
</body>
</html>
