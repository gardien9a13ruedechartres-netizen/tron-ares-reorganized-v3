<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player HLS Autoplay</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    .player-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      background: #000;
    }

    .iframe-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 10;
      background: transparent;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="player-wrapper">
    <video
      id="video"
      autoplay
      playsinline
      controls
      preload="auto"
      crossorigin="anonymous"
    ></video>

    <iframe
      class="iframe-overlay"
      src="about:blank"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const hlsUrl = 'https://cluone.dad:443/live/99F7CFCD396779DC13E1FEF9BA9F9AE8/3.m3u8';

    video.muted = false;
    video.autoplay = true;
    video.playsInline = true;

    function startPlayback() {
      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.catch(function () {
          // Certains navigateurs bloquent encore l'autoplay selon leurs règles internes.
          // Le player reste sans bouton, comme demandé.
        });
      }
    }

    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = hlsUrl;
      video.addEventListener('loadedmetadata', startPlayback, { once: true });
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({
        autoStartLoad: true,
        startPosition: -1,
        capLevelToPlayerSize: false,
        enableWorker: true
      });

      hls.loadSource(hlsUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        startPlayback();
      });
    } else {
      video.src = hlsUrl;
      video.addEventListener('canplay', startPlayback, { once: true });
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && video.paused) {
        startPlayback();
      }
    });
  </script>
</body>
</html>
