<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#000;
}

#wrap{
  position:fixed;
  inset:0;
}

iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  visibility:hidden;
}

iframe.active{
  visibility:visible;
}

#switchButton{
  position:fixed;
  top:12px;
  right:12px;
  z-index:9999;
  width:42px;
  height:42px;
  border:0;
  cursor:pointer;
  background:rgba(255,255,255,.18);
  border-radius:999px;
}
</style>
</head>

<body>

<div id="wrap"></div>
<button id="switchButton" aria-label="Changer de lecteur"></button>

<script>
const IFRAME_1_URL = 'https://canal-plus.victor-salema-53d.workers.dev/';
const IFRAME_2_URL = 'https://lovetier.bz/player/CANALPLFR';

const wrap = document.getElementById('wrap');
const switchButton = document.getElementById('switchButton');

let current = 1;
let iframe1 = null;
let iframe2 = null;

function createIframe(url){
  const iframe = document.createElement('iframe');
  iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = 'no-referrer';
  iframe.src = url;
  return iframe;
}

function stopIframe(iframe){
  if(!iframe) return;

  try{
    iframe.src = 'about:blank';
  }catch(e){}

  try{
    iframe.remove();
  }catch(e){}
}

function showIframe(number){
  if(number === 1){
    stopIframe(iframe2);
    iframe2 = null;

    iframe1 = createIframe(IFRAME_1_URL);
    iframe1.classList.add('active');
    wrap.appendChild(iframe1);

    current = 1;
  }else{
    stopIframe(iframe1);
    iframe1 = null;

    iframe2 = createIframe(IFRAME_2_URL);
    iframe2.classList.add('active');
    wrap.appendChild(iframe2);

    current = 2;
  }
}

showIframe(1);

switchButton.addEventListener('click', function(){
  if(current === 1){
    showIframe(2);
  }else{
    showIframe(1);
  }
});
</script>

</body>
</html>
