<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BTV</title>
  <style>
    html,body,video{width:100%;height:100%;margin:0;background:#000}
    body{overflow:hidden} video{position:fixed;inset:0;object-fit:fill}
    #controls{position:fixed;left:16px;right:16px;bottom:16px;z-index:2;color:#fff;font:14px Arial;background:#000b;padding:12px;border-radius:10px}
    button{margin-top:8px;padding:9px 14px;font-weight:700}
  </style>
</head>
<body data-channel="BTV1" data-title="BTV">
  <video id="video" controls autoplay playsinline></video>
  <div id="controls"><span id="status">Chargement...</span><br><button id="play">Lecture avec son</button></div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
  <script src="/pages/worker-iptv-player.js"></script>
</body>
</html>
