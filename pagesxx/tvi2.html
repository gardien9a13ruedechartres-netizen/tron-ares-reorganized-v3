<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#video{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:fill;
}
</style>

</head>

<body>

<video
id="video"
poster=""
controls
playsinline
autoplay
muted>
</video>

<script>
const video = document.getElementById('video');

if (Hls.isSupported()) {

    var hls = new Hls({
        debug: true,
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 90
    });

    hls.loadSource(
        'https://raw.githubusercontent.com/LITUATUI/M3UPT/refs/heads/main/M3U/TVI.m3u8'
    );

    hls.attachMedia(video);

    hls.on(Hls.Events.MEDIA_ATTACHED, function () {
        video.muted = false;
        video.play();
    });

}
else if (video.canPlayType('application/vnd.apple.mpegurl')) {

    video.src =
    'https://raw.githubusercontent.com/LITUATUI/M3UPT/refs/heads/main/M3U/TVI.m3u8';

    video.addEventListener('canplay', function () {
        video.play();
    });

}
</script>

</body>
</html>
