<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Player Worker CMTVPT</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background: transparent;
      opacity: 0;
      visibility: hidden;
      transition: opacity 80ms linear;
    }

    video.ready {
      opacity: 1;
      visibility: visible;
    }

    #overlay {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      font-family: Arial, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 12px;
      line-height: 1.4;
      visibility: hidden;
      pointer-events: none;
    }

    #overlay.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    button {
      margin-top: 8px;
      padding: 10px 14px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
    }

    code {
      word-break: break-all;
      color: #d7f7ff;
    }
    html::before, html::after {
      position: fixed; z-index: 50; pointer-events: none;
      transition: opacity .18s ease, visibility .18s ease;
    }
    html::before { content: ""; inset: 0; background: #07191d; }
    html::after {
      content: "CHARGEMENT DU DIRECT"; left: 50%; top: 50%;
      transform: translate(-50%, -50%); color: #9debf0;
      font: 600 13px Arial, sans-serif; letter-spacing: 0;
      border: 2px solid rgba(157,235,240,.3); border-top-color: #9debf0;
      border-radius: 50%; width: 112px; height: 112px;
      display: grid; place-items: center; text-align: center;
      animation: stream-wait 1.1s ease-in-out infinite alternate;
    }
    html.stream-ready::before, html.stream-ready::after { opacity: 0; visibility: hidden; }
    @keyframes stream-wait { to { opacity: .62; } }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline webkit-playsinline preload="auto"></video>

  <div id="overlay" class="hidden" aria-hidden="true">
    <div><strong>Player HLS généré</strong></div>
    <div hidden>URL ciblée : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="playBtn" type="button">Activer lecture avec son</button>
  </div>

  <script type="application/json" id="hls-data">{"url":"https://player-engine.com/api/worker-live/sic/master.m3u8","upstreamUrl":"","urls":["https://player-engine.com/api/worker-live/sic/master.m3u8"],"sourcePage":"Cloudflare Worker autonome","generatedAt":"2026-06-28T07:16:09.751Z"}</script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  <script>
    const dataNode = document.getElementById('hls-data');
    const HLS_DATA = JSON.parse(dataNode.textContent || '{}');
    let HLS_URL = String(HLS_DATA.url || '');
    const ALL_TARGET_URLS = Array.isArray(HLS_DATA.urls) ? HLS_DATA.urls : [];
    const SOURCE_PAGE = String(HLS_DATA.sourcePage || '');
    const GENERATED_AT = String(HLS_DATA.generatedAt || '');

    const video = document.getElementById('video');
    video.addEventListener('playing', () => document.documentElement.classList.add('stream-ready'));
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const playBtn = document.getElementById('playBtn');
    const urlLabel = document.getElementById('urlLabel');

    let hlsInstance = null;
    let retryTimer = null;
    let retryDelayMs = 1500;
    let firstFrameDisplayed = false;

    window.__CHANNEL_HLS_URL__ = HLS_URL;
    window.__CHANNEL_HLS_URLS__ = ALL_TARGET_URLS;
    window.__CHANNEL_SOURCE_PAGE__ = SOURCE_PAGE;
    window.__CHANNEL_GENERATED_AT__ = GENERATED_AT;

    urlLabel.textContent = HLS_URL || '(aucune URL)';

    video.muted = false;
    video.defaultMuted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;
    video.controls = true;
    video.preload = 'auto';
    video.style.objectFit = 'fill';

    function setMessage(text) {
      msg.textContent = text;
    }

    function keepUnmuted() {
      video.muted = false;
      video.defaultMuted = false;
      if (video.volume === 0) video.volume = 1;
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
      overlay.setAttribute('aria-hidden', 'true');
      overlay.style.visibility = 'hidden';
      overlay.style.pointerEvents = 'none';
    }

    function hideVideoUntilRealFrame() {
      firstFrameDisplayed = false;
      video.classList.remove('ready');
      video.style.visibility = 'hidden';
      video.style.opacity = '0';
    }

    function revealVideo() {
      firstFrameDisplayed = true;
      video.classList.add('ready');
      video.style.visibility = 'visible';
      video.style.opacity = '1';
      hideOverlay();
    }

    function revealWhenFrameExists() {
      if (firstFrameDisplayed) return;
      if (video.readyState >= 2) revealVideo();
    }

    async function playWithSound() {
      keepUnmuted();
      try {
        await video.play();
        keepUnmuted();
        revealWhenFrameExists();
        hideOverlay();
      } catch (error) {
        keepUnmuted();
        hideOverlay();
        setMessage('Autoplay avec son bloque par le navigateur. Le player reste non muet.');
      }
    }

    function scheduleRecovery() {
      if (retryTimer) return;
      const delay = retryDelayMs;
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
      hideVideoUntilRealFrame();
      setMessage('Flux temporairement indisponible. Nouvelle tentative...');
      retryTimer = setTimeout(function () {
        retryTimer = null;
        attachSource(HLS_URL);
      }, delay);
    }

    function clearCurrentPlayer() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.removeAttribute('src');
      video.load();
    }

    function attachSource(nextUrl) {
      document.documentElement.classList.remove('stream-ready');
      HLS_URL = String(nextUrl || HLS_URL || '');
      window.__CHANNEL_HLS_URL__ = HLS_URL;
      urlLabel.textContent = HLS_URL || '(aucune URL)';
      hideOverlay();
      hideVideoUntilRealFrame();
      keepUnmuted();

      if (!HLS_URL) {
        setMessage('Aucune URL HLS ciblee dans ce fichier.');
        return;
      }

      clearCurrentPlayer();

      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          liveSyncDurationCount: 1,
          liveMaxLatencyDurationCount: 3,
          backBufferLength: 0,
          maxBufferLength: 8
        });

        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MEDIA_ATTACHED, function () {
          hlsInstance.loadSource(HLS_URL);
        });

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
          retryDelayMs = 1500;
          if (retryTimer) {
            clearTimeout(retryTimer);
            retryTimer = null;
          }
          setMessage('Manifest HLS charge. Lecture immediate...');
          playWithSound();
        });

        hlsInstance.on(Hls.Events.FRAG_BUFFERED, function () {
          revealWhenFrameExists();
        });

        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
          console.warn('Erreur HLS:', data);
          keepUnmuted();
          if (!data || !data.fatal) return;

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            hlsInstance.startLoad();
            scheduleRecovery();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hlsInstance.recoverMediaError();
          } else {
            scheduleRecovery();
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = HLS_URL;
        video.addEventListener('loadeddata', function () {
          revealWhenFrameExists();
          playWithSound();
        }, { once: true });
        video.load();
        playWithSound();
      } else {
        setMessage('HLS.js non charge ou HLS non supporte par ce navigateur.');
      }
    }

    async function refreshPublishedSource() {
      if (!/^https?:$/.test(location.protocol)) return;
      try {
        const refreshUrl = new URL(location.href);
        refreshUrl.searchParams.set('_hls_refresh', String(Date.now()));
        const response = await fetch(refreshUrl, { cache: 'no-store' });
        if (!response.ok) return;
        const html = await response.text();
        const nextDocument = new DOMParser().parseFromString(html, 'text/html');
        const nextDataNode = nextDocument.getElementById('hls-data');
        if (!nextDataNode) return;
        const nextData = JSON.parse(nextDataNode.textContent || '{}');
        const nextUrl = String(nextData.url || '');
        if (nextUrl && nextUrl !== HLS_URL) {
          setMessage('Nouveau master detecte. Mise a jour du flux...');
          attachSource(nextUrl);
        }
      } catch (error) {
        console.warn('Verification du nouveau master impossible:', error);
      }
    }

    video.addEventListener('loadeddata', revealWhenFrameExists);
    video.addEventListener('canplay', revealWhenFrameExists);
    video.addEventListener('playing', revealWhenFrameExists);
    video.addEventListener('volumechange', keepUnmuted);
    playBtn.addEventListener('click', playWithSound);

    hideOverlay();
    attachSource(HLS_URL);
    setInterval(refreshPublishedSource, 20000);

    console.log('URL HLS ciblee:', HLS_URL);
    console.log('Toutes les URLs ciblees:', ALL_TARGET_URLS.join('\\n'));
  </script>
</body>
</html>
