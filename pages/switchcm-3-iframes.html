<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Switch CM - 1 HLS + 2 iframes</title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#wrap{
    position:fixed;
    inset:0;
    background:#000;
}

.playerFrame,
.playerVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    background:#000;
}

.playerVideo{
    object-fit:contain;
}

.controlButton{
    position:fixed;
    z-index:9999;
    width:48px;
    height:48px;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:22px;
    line-height:1;
}

.controlButton:hover{
    background:rgba(255,255,255,.25);
}

#switchButton{
    top:12px;
    right:12px;
}

#refreshButton{
    top:12px;
    right:72px;
}

#playerBadge{
    position:fixed;
    top:72px;
    right:12px;
    z-index:9999;
    min-width:48px;
    height:28px;
    padding:0 10px;
    border-radius:999px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    user-select:none;
}

#errorBox{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    z-index:9999;
    max-width:min(92vw,720px);
    padding:12px 16px;
    border-radius:12px;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    line-height:1.35;
    display:none;
    text-align:center;
}

#switchButton::before{
    content:"⇄";
}

#refreshButton::before{
    content:"↻";
}
</style>
</head>

<body>

<div id="wrap"></div>

<button id="refreshButton" class="controlButton" title="Actualiser"></button>
<button id="switchButton" class="controlButton" title="Changer de lecteur"></button>
<div id="playerBadge">1/3</div>
<div id="errorBox"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const HLS_1_URL = 'https://player-engine.com/api/worker-live/cmtvpt/master.m3u8';
const IFRAME_2_URL = '/pages/worker-cmtvpt.html';
const IFRAME_3_URL = '/pages/grrr.CM.html';

const PLAYERS = [
    {
        type:'hls',
        url:HLS_1_URL
    },
    {
        type:'iframe',
        url:IFRAME_2_URL
    },
    {
        type:'iframe',
        url:IFRAME_3_URL
    }
];

const wrap = document.getElementById('wrap');
const playerBadge = document.getElementById('playerBadge');
const errorBox = document.getElementById('errorBox');

let currentPlayer = null;
let currentHls = null;
let currentIndex = 1;

function showError(message){
    if(!message){
        errorBox.style.display = 'none';
        errorBox.textContent = '';
        return;
    }

    errorBox.textContent = message;
    errorBox.style.display = 'block';
}

function normalizeIndex(index){
    const total = PLAYERS.length;

    if(index < 1) return total;
    if(index > total) return 1;

    return index;
}

function getCurrentPlayerConfig(){
    return PLAYERS[currentIndex - 1];
}

function updatePlayerBadge(){
    playerBadge.textContent = currentIndex + '/' + PLAYERS.length;
}

function destroyCurrentPlayer(){
    showError('');

    if(currentHls){
        try{
            currentHls.destroy();
        }catch(e){}

        currentHls = null;
    }

    if(currentPlayer){
        try{
            if(currentPlayer.tagName === 'VIDEO'){
                currentPlayer.pause();
                currentPlayer.removeAttribute('src');
                currentPlayer.load();
            }else if(currentPlayer.tagName === 'IFRAME'){
                currentPlayer.src = 'about:blank';
            }
        }catch(e){}

        currentPlayer.remove();
        currentPlayer = null;
    }
}

function createIframe(url){
    const iframe = document.createElement('iframe');
    const frameUrl = new URL(url, window.location.href);

    iframe.className = 'playerFrame';
    iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-presentation allow-popups';
    iframe.src = frameUrl.href;

    return iframe;
}

function createHlsVideo(url){
    const video = document.createElement('video');

    video.className = 'playerVideo';
    video.controls = true;
    video.autoplay = true;
    video.muted = false;
    video.playsInline = true;
    video.preload = 'auto';

    video.addEventListener('error',()=>{
        showError('Erreur de lecture HLS. Vérifie que le flux est actif et autorisé par le navigateur.');
    });

    if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src = url;
        video.play().catch(()=>{});
        return video;
    }

    if(window.Hls && Hls.isSupported()){
        currentHls = new Hls({
            enableWorker:true,
            lowLatencyMode:true,
            backBufferLength:30
        });

        currentHls.loadSource(url);
        currentHls.attachMedia(video);

        currentHls.on(Hls.Events.MANIFEST_PARSED,()=>{
            video.play().catch(()=>{});
        });

        currentHls.on(Hls.Events.ERROR,(event,data)=>{
            if(data && data.fatal){
                showError('Erreur HLS fatale. Le lecteur va tenter de récupérer le flux.');

                switch(data.type){
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        currentHls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        currentHls.recoverMediaError();
                        break;
                    default:
                        destroyCurrentPlayer();
                        break;
                }
            }
        });

        return video;
    }

    showError('Ton navigateur ne prend pas en charge ce flux HLS.');
    return video;
}

function createPlayer(config){
    if(config.type === 'hls'){
        return createHlsVideo(config.url);
    }

    return createIframe(config.url);
}

function loadPlayer(index){
    destroyCurrentPlayer();

    currentIndex = normalizeIndex(index);

    const config = getCurrentPlayerConfig();

    currentPlayer = createPlayer(config);

    wrap.appendChild(currentPlayer);

    updatePlayerBadge();
}

function refreshCurrentPlayer(){
    loadPlayer(currentIndex);
}

loadPlayer(1);

document
.getElementById('switchButton')
.addEventListener('click',()=>{
    loadPlayer(currentIndex + 1);
});

document
.getElementById('refreshButton')
.addEventListener('click',()=>{
    refreshCurrentPlayer();
});
</script>

</body>
</html>
