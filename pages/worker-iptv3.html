<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
  <link rel="preconnect" href="https://tron-ares-iptv3.victor-salema-53d.workers.dev" crossorigin>
  <link rel="dns-prefetch" href="//tron-ares-iptv3.victor-salema-53d.workers.dev">
  <title>Player Worker IPTV3</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background: #000;
    }
    #overlay {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      font-family: Arial, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 12px;
      line-height: 1.4;
      visibility: hidden;
      pointer-events: none;
    }
    #overlay.hidden { display: none; }
    button {
      margin-top: 8px;
      padding: 10px 14px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      pointer-events: auto;
    }
    code { word-break: break-all; color: #d7f7ff; }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: #f9fafb;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(360px, 82vw);
      text-align: center;
    }
    .loader-logo {
      width: 156px;
      max-width: 46vw;
      height: 156px;
      max-height: 30vh;
      object-fit: contain;
      margin-bottom: 26px;
      filter: drop-shadow(0 8px 26px rgba(0,0,0,.9));
      animation: logoPulse 1.6s ease-in-out infinite;
    }
    .loader-logo-badge {
      width: 156px;
      max-width: 46vw;
      height: 156px;
      max-height: 30vh;
      margin-bottom: 26px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid rgba(96,165,250,.62);
      background: radial-gradient(circle at 35% 25%, rgba(96,165,250,.28), rgba(0,12,24,.92) 62%);
      color: #eaf6ff;
      font-size: clamp(24px, 8vw, 44px);
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 3px 18px rgba(0,0,0,.9);
      box-shadow: 0 0 32px rgba(59,130,246,.35);
      animation: logoPulse 1.6s ease-in-out infinite;
    }
    .pro-spinner {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,.14);
      border-top-color: #3b82f6;
      border-right-color: #60a5fa;
      animation: spin .9s linear infinite;
      margin-bottom: 18px;
    }
    .loader-progress-wrap {
      width: 260px;
      max-width: 72vw;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
      margin-bottom: 10px;
    }
    .loader-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2563eb, #60a5fa, #93c5fd);
      box-shadow: 0 0 18px rgba(59,130,246,.75);
      transition: width .35s ease;
    }
    .loader-progress-text {
      min-height: 18px;
      margin-bottom: 14px;
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 2px 12px rgba(0,0,0,.85);
    }
    .loading-text {
      font-size: 18px;
      font-weight: 600;
      color: #e5e7eb;
      text-shadow: 0 2px 14px rgba(0,0,0,.85);
    }
    .dots::after {
      content: "";
      display: inline-block;
      width: 24px;
      animation: dots 1.4s infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes logoPulse { 0%,100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.045); opacity: 1; } }
    @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
  <div id="loadingOverlay">
    <div class="loader-content">
      <img id="loadingLogo" class="loader-logo" alt="">
      <div id="loadingLogoBadge" class="loader-logo-badge"></div>
      <div class="pro-spinner"></div>
      <div class="loader-progress-wrap" aria-hidden="true">
        <div id="loadingProgressFill" class="loader-progress-fill"></div>
      </div>
      <div id="loadingProgressText" class="loader-progress-text">Initialisation... 0%</div>
      <div class="loading-text">Chargement du flux<span class="dots"></span></div>
    </div>
  </div>
  <div id="overlay">
    <div><strong>Player HLS genere</strong></div>
    <div hidden>URL ciblee : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="playBtn">Activer lecture avec son</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16"></script>
  <script>
    const channels = {
      tf1: 'TF1',
      cmtv: 'CMTV',
      btv: 'BTV',
      'sport-tv-1': 'Sport TV 1',
      'sport-tv-5': 'Sport TV 5',
      'canal-panda': 'Canal Panda',
      'disney-pixar': 'Disney+ Pixar',
      '6ter': '6ter',
      cstar: 'CStar',
      w9: 'W9',
      m6: 'M6'
    };
    const channelLogos = {
      tf1: '/media/image/tf1.webp',
      cmtv: '/media/cmtv.png',
      btv: 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/portugal/btv-hd-pt.png',
      'sport-tv-1': '/media/sport-tv-1.png',
      'sport-tv-5': '/media/sport-tv-5.png',
      'canal-panda': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/portugal/canal-panda-pt.png',
      'disney-pixar': '/media/disney-pixar.png',
      '6ter': 'https://commons.wikimedia.org/wiki/Special:FilePath/Logo%206ter%202016.svg',
      cstar: 'https://commons.wikimedia.org/wiki/Special:FilePath/Logo%20CStar%202016.svg',
      w9: 'https://commons.wikimedia.org/wiki/Special:FilePath/W9-Logo.svg',
      m6: 'https://focus.telerama.fr/500x500/0000/00/01/clear-118.png'
    };
    const params = new URLSearchParams(location.search);
    const channelKey = String(params.get('channel') || 'cmtv').toLowerCase();
    const channelName = channels[channelKey] || '';
    const workerBase = 'https://tron-ares-iptv3.victor-salema-53d.workers.dev/api/iptv/live';
    const legacyWorkerBase = 'https://tron-ares-iptv.victor-salema-53d.workers.dev/api/iptv/live';
    const legacyWideBase = 'https://player-engine.com/api/worker-live';
    const fallbackUrls = {
      cmtv: `${legacyWideBase}/cmtvpt/master.m3u8`,
      btv: `${legacyWorkerBase}/btv/master.m3u8`,
      'sport-tv-1': `${legacyWorkerBase}/sport-tv-1/master.m3u8`,
      'sport-tv-5': `${legacyWorkerBase}/sport-tv-5/master.m3u8`,
      m6: `${legacyWorkerBase}/m6fr/master.m3u8`
    };
    const BASE_HLS_URL = channelName ? `${workerBase}/${encodeURIComponent(channelKey)}/master.m3u8` : '';
    const FALLBACK_HLS_URL = fallbackUrls[channelKey] || '';
    let HLS_URL = BASE_HLS_URL;
    let sourceMode = 'primary';
    const ALL_TARGET_URLS = [BASE_HLS_URL, FALLBACK_HLS_URL].filter(Boolean);
    const SOURCE_PAGE = 'Cloudflare Worker IPTV3 autonome';
    const GENERATED_AT = '';
    document.title = channelName ? `Player Worker IPTV3 ${channelName}` : 'Chaine IPTV3 inconnue';

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const playBtn = document.getElementById('playBtn');
    const urlLabel = document.getElementById('urlLabel');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingLogo = document.getElementById('loadingLogo');
    const loadingLogoBadge = document.getElementById('loadingLogoBadge');
    const loadingProgressFill = document.getElementById('loadingProgressFill');
    const loadingProgressText = document.getElementById('loadingProgressText');
    let hlsInstance = null;
    let retryTimer = null;
    let retryDelayMs = 3000;
    let loaderProgressTimer = null;
    let lastLoaderProgress = 0;
    let stallTimer = null;
    let stallRecoveryCount = 0;

    window.__CHANNEL_HLS_URL__ = HLS_URL;
    window.__CHANNEL_HLS_URLS__ = ALL_TARGET_URLS;
    window.__CHANNEL_SOURCE_MODE__ = sourceMode;
    window.__CHANNEL_SOURCE_PAGE__ = SOURCE_PAGE;
    window.__CHANNEL_GENERATED_AT__ = GENERATED_AT;

    urlLabel.textContent = HLS_URL || '(aucune URL)';
    video.muted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;
    video.style.objectFit = 'fill';


    function channelInitials() {
      const label = String(channelName || channelKey || 'TV').replace(/[^a-z0-9+]+/gi, ' ').trim();
      const parts = label.split(/\s+/).filter(Boolean);
      if (!parts.length) return 'TV';
      if (parts.length === 1) return parts[0].slice(0, 4).toUpperCase();
      return parts.slice(0, 3).map(part => part[0]).join('').toUpperCase();
    }

    function setLoaderLogo() {
      const src = channelLogos[channelKey] || '';
      const initials = channelInitials();
      loadingLogoBadge.textContent = initials;
      if (!src) {
        loadingLogo.removeAttribute('src');
        loadingLogo.style.display = 'none';
        loadingLogoBadge.style.display = 'flex';
        return;
      }
      loadingLogoBadge.style.display = 'none';
      loadingLogo.style.display = 'block';
      loadingLogo.alt = channelName || initials;
      loadingLogo.onerror = () => {
        loadingLogo.style.display = 'none';
        loadingLogoBadge.style.display = 'flex';
      };
      loadingLogo.src = src;
    }

    function setLoadingProgress(value, label) {
      const safeValue = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
      lastLoaderProgress = Math.max(lastLoaderProgress, safeValue);
      loadingProgressFill.style.width = lastLoaderProgress + '%';
      loadingProgressText.textContent = (label || 'Chargement du flux') + '... ' + lastLoaderProgress + '%';
    }

    function startLoader(label) {
      loadingOverlay.classList.remove('hidden');
      clearInterval(loaderProgressTimer);
      lastLoaderProgress = 0;
      setLoaderLogo();
      setLoadingProgress(4, label || 'Initialisation');
      loaderProgressTimer = setInterval(() => {
        if (loadingOverlay.classList.contains('hidden')) return;
        if (lastLoaderProgress < 72) setLoadingProgress(lastLoaderProgress + 1, 'Chargement du flux');
      }, 420);
    }

    function hideLoader(label) {
      setLoadingProgress(100, label || 'Flux pret');
      clearInterval(loaderProgressTimer);
      loaderProgressTimer = null;
      setTimeout(() => loadingOverlay.classList.add('hidden'), 180);
    }

    function setMessage(text) { msg.textContent = text; }

    async function playWithSound() {
      try {
        video.muted = false;
        video.volume = 1;
        await video.play();
        overlay.classList.add('hidden');
        hideLoader('Flux actif');
      } catch (error) {
        hideLoader('Pret a demarrer');
        overlay.classList.remove('hidden');
        setMessage('Lecture automatique avec son bloquee par le navigateur. Clique sur le bouton pour lancer.');
      }
    }

    function withRefresh(url) {
      if (!url) return '';
      const next = new URL(url, location.href);
      next.searchParams.set('_hls_refresh', String(Date.now()));
      return next.href;
    }

    function clearStallRecovery() {
      if (stallTimer) {
        clearTimeout(stallTimer);
        stallTimer = null;
      }
      stallRecoveryCount = 0;
    }

    function sourceModeFor(url) {
      return FALLBACK_HLS_URL && String(url || '').startsWith(FALLBACK_HLS_URL) ? 'fallback' : 'primary';
    }

    function currentBaseUrl() {
      return sourceMode === 'fallback' ? FALLBACK_HLS_URL : BASE_HLS_URL;
    }

    function switchToFallback(reason) {
      if (!FALLBACK_HLS_URL || sourceMode === 'fallback') return false;
      console.warn('Bascule vers worker-iptv stable:', reason);
      sourceMode = 'fallback';
      retryDelayMs = 3000;
      clearStallRecovery();
      attachSource(withRefresh(FALLBACK_HLS_URL));
      return true;
    }

    function reloadCurrentSource() {
      attachSource(withRefresh(currentBaseUrl() || HLS_URL));
    }

    function scheduleRecovery() {
      if (retryTimer) return;
      const delay = retryDelayMs;
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
      setMessage('Flux temporairement indisponible. Nouvelle tentative...');
      retryTimer = setTimeout(() => {
        retryTimer = null;
        if (!switchToFallback('network-error')) reloadCurrentSource();
      }, delay);
    }

    function scheduleStallRecovery() {
      if (!HLS_URL || stallTimer) return;
      stallTimer = setTimeout(() => {
        stallTimer = null;
        stallRecoveryCount += 1;
        if (hlsInstance && stallRecoveryCount <= 2) {
          console.warn('Recovery HLS apres bufferStalledError:', stallRecoveryCount);
          hlsInstance.recoverMediaError();
          hlsInstance.startLoad(-1);
          playWithSound();
          return;
        }
        console.warn('Rechargement du master apres blocage persistant');
        stallRecoveryCount = 0;
        if (!switchToFallback('persistent-stall')) reloadCurrentSource();
      }, 4500);
    }

    function attachSource(nextUrl = HLS_URL) {
      HLS_URL = String(nextUrl || '');
      sourceMode = sourceModeFor(HLS_URL);
      window.__CHANNEL_HLS_URL__ = HLS_URL;
      window.__CHANNEL_SOURCE_MODE__ = sourceMode;
      urlLabel.textContent = HLS_URL || '(aucune URL)';
      if (!HLS_URL) {
        hideLoader('Aucune source');
        setMessage('Chaine inconnue pour worker-iptv3.');
        overlay.classList.remove('hidden');
        return;
      }
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      startLoader(sourceMode === 'fallback' ? 'Connexion secours' : 'Connexion HLS');
      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(HLS_URL);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MEDIA_ATTACHED, () => setLoadingProgress(58, 'Media attache'));
        hlsInstance.on(Hls.Events.FRAG_LOADED, () => setLoadingProgress(88, 'Segments video recus'));
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          retryDelayMs = 3000;
          clearStallRecovery();
          if (retryTimer) {
            clearTimeout(retryTimer);
            retryTimer = null;
          }
          setLoadingProgress(76, 'Manifest charge');
          setMessage('Manifest HLS charge. Tentative autoplay avec son...');
          playWithSound();
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          console.warn('Erreur HLS:', data);
          if (data && data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) scheduleStallRecovery();
          if (data && data.fatal) scheduleRecovery();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = HLS_URL;
        setLoadingProgress(58, 'Media natif');
        video.addEventListener('loadedmetadata', () => { setLoadingProgress(95, 'Presque pret'); playWithSound(); }, { once: true });
      } else {
        hideLoader('Erreur lecteur');
        setMessage('HLS.js non charge ou HLS non supporte par ce navigateur.');
        hideLoader('Erreur lecteur');
        overlay.classList.remove('hidden');
      }
    }

    playBtn.addEventListener('click', playWithSound);
    video.addEventListener('loadedmetadata', () => setLoadingProgress(95, 'Presque pret'));
    video.addEventListener('canplay', () => hideLoader('Flux pret'));
    video.addEventListener('playing', () => hideLoader('Flux actif'));
    video.addEventListener('waiting', scheduleStallRecovery);
    video.addEventListener('stalled', scheduleStallRecovery);
    video.addEventListener('playing', clearStallRecovery);
    video.addEventListener('timeupdate', () => {
      if (!video.paused && video.readyState >= 3) clearStallRecovery();
    });
    attachSource();

    console.log('URL HLS ciblee:', HLS_URL);
    console.log('Toutes les URLs ciblees:', ALL_TARGET_URLS.join('\n'));
  </script>
</body>
</html>
