<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
  <link rel="preconnect" href="https://tron-ares-iptv.victor-salema-53d.workers.dev" crossorigin>
  <link rel="dns-prefetch" href="//tron-ares-iptv.victor-salema-53d.workers.dev">
  <title>Player Worker IPTV</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background: #000;
    }
    video::-webkit-media-controls,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-enclosure {
      display: flex !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    .player-controls {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px;
      color: #f9fafb;
      background: rgba(0, 0, 0, .68);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 8px;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      pointer-events: auto;
    }
    .player-controls button {
      margin: 0;
      min-height: 34px;
      padding: 8px 10px;
      color: #fff;
      background: rgba(17, 24, 39, .92);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 6px;
    }
    .player-controls input[type="range"] {
      width: min(28vw, 160px);
      accent-color: #60a5fa;
    }
    .control-time {
      margin-left: auto;
      min-width: 54px;
      font-size: 12px;
      font-weight: 700;
      color: #dbeafe;
      text-align: right;
      white-space: nowrap;
    }
    @media (max-width: 520px) {
      .player-controls {
        left: 8px;
        right: 8px;
        gap: 6px;
        padding: 6px;
      }
      .player-controls button {
        min-height: 32px;
        padding: 7px 8px;
        font-size: 12px;
      }
      .player-controls input[type="range"] { width: 90px; }
      .control-time { display: none; }
    }
    
  #overlay {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      font-family: Arial, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 12px;
      line-height: 1.4;
      visibility: hidden;
      pointer-events: none;
    }



    #overlay.hidden { display: none; }
    button {
      margin-top: 8px;
      padding: 10px 14px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
    }
    code { word-break: break-all; color: #d7f7ff; }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: #f9fafb;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(360px, 82vw);
      text-align: center;
    }
    .loader-logo {
      width: 156px;
      max-width: 46vw;
      height: 156px;
      max-height: 30vh;
      object-fit: contain;
      margin-bottom: 26px;
      filter: drop-shadow(0 8px 26px rgba(0,0,0,.9));
      animation: logoPulse 1.6s ease-in-out infinite;
    }
    .loader-logo-badge {
      width: 156px;
      max-width: 46vw;
      height: 156px;
      max-height: 30vh;
      margin-bottom: 26px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid rgba(96,165,250,.62);
      background: radial-gradient(circle at 35% 25%, rgba(96,165,250,.28), rgba(0,12,24,.92) 62%);
      color: #eaf6ff;
      font-size: clamp(24px, 8vw, 44px);
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 3px 18px rgba(0,0,0,.9);
      box-shadow: 0 0 32px rgba(59,130,246,.35);
      animation: logoPulse 1.6s ease-in-out infinite;
    }
    .pro-spinner {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,.14);
      border-top-color: #3b82f6;
      border-right-color: #60a5fa;
      animation: spin .9s linear infinite;
      margin-bottom: 18px;
    }
    .loader-progress-wrap {
      width: 260px;
      max-width: 72vw;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
      margin-bottom: 10px;
    }
    .loader-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2563eb, #60a5fa, #93c5fd);
      box-shadow: 0 0 18px rgba(59,130,246,.75);
      transition: width .35s ease;
    }
    .loader-progress-text {
      min-height: 18px;
      margin-bottom: 14px;
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 2px 12px rgba(0,0,0,.85);
    }
    .loading-text {
      font-size: 18px;
      font-weight: 600;
      color: #e5e7eb;
      text-shadow: 0 2px 14px rgba(0,0,0,.85);
    }
    .dots::after {
      content: "";
      display: inline-block;
      width: 24px;
      animation: dots 1.4s infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes logoPulse { 0%,100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.045); opacity: 1; } }
    @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
  <div id="playerControls" class="player-controls" aria-label="Controles du lecteur">
    <button id="controlPlay" type="button">Pause</button>
    <button id="controlMute" type="button">Son</button>
    <input id="controlVolume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
    <div id="controlTime" class="control-time">Direct</div>
    <button id="controlFullscreen" type="button">Plein ecran</button>
  </div>
  <div id="loadingOverlay">
    <div class="loader-content">
      <img id="loadingLogo" class="loader-logo" alt="">
      <div id="loadingLogoBadge" class="loader-logo-badge"></div>
      <div class="pro-spinner"></div>
      <div class="loader-progress-wrap" aria-hidden="true">
        <div id="loadingProgressFill" class="loader-progress-fill"></div>
      </div>
      <div id="loadingProgressText" class="loader-progress-text">Initialisation... 0%</div>
      <div class="loading-text">Chargement du flux<span class="dots"></span></div>
    </div>
  </div>
  <div id="overlay">
    <div><strong>Player HLS généré</strong></div>
    <div hidden>URL ciblée : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="playBtn">Activer lecture avec son</button>
  </div>
<script type="application/json" id="channel-data">{"cmtvpt":"CMTV","rtp1":"RTP1","rtp2":"RTP2","rtp3":"RTP3","sic":"SIC","tvi":"TVI","porto-canal":"Porto Canal","rtp-africa":"RTP África","btv":"BTV","sport-tv-1":"Sport TV 1","sport-tv-2":"Sport TV 2","sport-tv-3":"Sport TV 3","sport-tv-4":"Sport TV 4","sport-tv-5":"Sport TV 5","sport-tv-plus":"Sport TV +","eurosport-1-pt":"Eurosport 1 PT","eurosport-2-pt":"Eurosport 2 PT","dazn-1":"DAZN 1 PT","dazn-2":"DAZN 2 PT","dazn-3":"DAZN 3 PT","dazn-4":"DAZN 4 PT","dazn-5":"DAZN 5 PT","canal-11":"Canal 11","a-bola":"A Bola TV","sporting":"Sporting TV","recordeuropa":"RECORD EUROPA","tf1fr":"TF1","m6fr":"M6","canalplfr":"CANAL+","artefr":"Arte","cnewsfr":"CNEWS","bein-sports-1":"beIN SPORTS 1","bein-sports-2":"beIN SPORTS 2","bein-sports-3":"beIN SPORTS 3","canal-foot":"CANAL+ Foot","canal-sport":"CANAL+ Sport","canal-sport-360":"CANAL+ Sport 360","canal-docs":"CANAL+ Docs","eurosport-1":"EUROSPORT 1","eurosport-2":"EUROSPORT 2","l-equipe":"L'Equipe","equidia":"EQUIDIA","rmc-sport-1":"RMC Sport 1","rmc-sport-2":"RMC Sport 2"}</script>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16"></script>
  <script>
    const channels = JSON.parse(document.getElementById('channel-data').textContent || '{}');
    channels['record-europa'] = channels.recordeuropa || 'RECORD EUROPA';
    channels['rtp3'] = channels.rtp3 || 'RTP3';
    channels['odisseia-pt'] = 'Odisseia PT';
    channels['national-geographic-pt'] = 'National Geographic PT';
    channels['historia-pt'] = 'História PT';
    channels['discovery-pt'] = 'Discovery PT';
    channels['tcv-int'] = 'TCV Internacional';
    channels['tvi-reality'] = 'TVI Reality';
    channels['tvi-ficcao'] = 'TVI Ficcao';
    channels['v-plus-tvi'] = 'V+ TVI';
    channels['cnn-portugal'] = 'CNN Portugal';
    channels['tvi-internacional'] = 'TVI Internacional';
    channels['sic-noticias'] = 'SIC Noticias';
    const channelLogos = {
      "a-bola": "https://www.telesatellite.com/images/actu/a/abolatv.jpg",
      artefr: "/media/image/arte.webp",
      "bein-sports-1": "/media/image/bein-sports-1.webp",
      "bein-sports-2": "/media/image/bein-sports-2.webp",
      "bein-sports-3": "/media/image/bein-sports-3.webp",
      "canal-11": "https://www.zupimages.net/up/24/13/qj99.jpg",
      "canal-docs": "https://commons.wikimedia.org/wiki/Special:FilePath/Canal%2B%20Docs.png",
      "canal-foot": "https://commons.wikimedia.org/wiki/Special:FilePath/Foot%2B%20%28logo%2C%202011-%29.svg",
      "canal-sport": "https://commons.wikimedia.org/wiki/Special:FilePath/Canal%2B%20Sport%20Logo%202013.png",
      "canal-sport-360": "https://commons.wikimedia.org/wiki/Special:FilePath/Canal%2BSport%20360.png",
      cnewsfr: "https://commons.wikimedia.org/wiki/Special:FilePath/Canal%20News%20logo.svg",
      "cnn-portugal": "/media/cnn.png",
      "dazn-1": "https://upload.wikimedia.org/wikipedia/commons/7/71/DAZN_logo.svg",
      "dazn-2": "https://upload.wikimedia.org/wikipedia/commons/7/71/DAZN_logo.svg",
      "dazn-3": "https://upload.wikimedia.org/wikipedia/commons/7/71/DAZN_logo.svg",
      "dazn-4": "https://upload.wikimedia.org/wikipedia/commons/7/71/DAZN_logo.svg",
      "dazn-5": "https://upload.wikimedia.org/wikipedia/commons/7/71/DAZN_logo.svg",
      "discovery-pt": "https://cdn.jsdelivr.net/gh/imagesloads/images@main/img_f3aea22ba48bd5da.png",
      equidia: "https://focus.telerama.fr/500x500/0000/00/01/clear-64.png",
      "eurosport-1": "https://commons.wikimedia.org/wiki/Special:FilePath/Eurosport%20Logo%20%282011-2015%29.svg",
      "eurosport-1-pt": "https://commons.wikimedia.org/wiki/Special:FilePath/Eurosport%20Logo%20%282011-2015%29.svg",
      "eurosport-2": "https://commons.wikimedia.org/wiki/Special:FilePath/Eurosport%202%20Logo%20%282011-2015%29.svg",
      "eurosport-2-pt": "https://commons.wikimedia.org/wiki/Special:FilePath/Eurosport%202%20Logo%20%282011-2015%29.svg",
      "historia-pt": "https://upload.wikimedia.org/wikipedia/commons/0/07/Historia_2022_logo.webp",
      "l-equipe": "https://focus.telerama.fr/500x500/0000/00/01/clear-1401.png",
      "national-geographic-pt": "https://commons.wikimedia.org/wiki/Special:FilePath/National%20Geographic%20Channel.svg",
      "odisseia-pt": "https://www.freeshot.live/upload/source/CanalOdisseia-logo.png",
      "porto-canal": "https://www.freeshot.live/upload/source/Porto-Canal-logo.png",
      "record-europa": "https://upload.wikimedia.org/wikipedia/commons/5/58/Logomarca_da_Record_%282023%29.webp",
      "rmc-sport-1": "https://commons.wikimedia.org/wiki/Special:FilePath/Logo%20RMC%20Sport%201%202018.svg",
      "rmc-sport-2": "https://commons.wikimedia.org/wiki/Special:FilePath/Logo%20RMC%20Sport%202%202018.svg",
      "rtp-africa": "https://commons.wikimedia.org/wiki/Special:FilePath/RTP%20%C3%81frica%202026.svg",
      rtp1: "/media/rtp1.jpg",
      rtp2: "https://upload.wikimedia.org/wikipedia/commons/f/f9/RTP2_logo_2016.svg",
      rtp3: "/media/rtpn.png",
      sic: "/media/sic.jpg",
      "sic-noticias": "/media/SICN.webp",
      "sport-tv-2": "/media/sport-tv-2.png",
      "sport-tv-3": "/media/sport-tv-3.png",
      "sport-tv-4": "/media/sport-tv-4.png",
      "sport-tv-plus": "https://cdn.jsdelivr.net/gh/imagesloads/images@main/img_1a740cf3fae8c219.png",
      sporting: "https://pplware.sapo.pt/wp-content/uploads/2017/06/scp_00.jpg",
      "tcv-int": "https://cdn.jsdelivr.net/gh/imagesloads/images@main/img_43acca95f234ef0a.png",
      tvi: "/media/TVI.png",
      "tvi-ficcao": "https://upload.wikimedia.org/wikipedia/commons/0/0d/TVI_Fic%C3%A7%C3%A3o_%282017%29.png",
      "tvi-internacional": "https://upload.wikimedia.org/wikipedia/commons/0/08/TVI_Internacional_%282017%29.png",
      "tvi-reality": "/media/tvir.jpg",
      "v-plus-tvi": "https://upload.wikimedia.org/wikipedia/pt/e/ef/V%2BTVI_Logo.png"
    };
    const channelKey = new URLSearchParams(location.search).get('channel') || '';
    const channelName = String(channels[channelKey] || '');
    const wideIptvChannels = new Set([
      'cmtvpt',
      'rtp1',
      'rtp2',
      'rtp3',
      'sic',
      'porto-canal',
      'rtp-africa',
      'record-europa',
      'odisseia-pt',
      'national-geographic-pt',
      'historia-pt',
      'discovery-pt',
      'tcv-int',
      'tvi',
      'tvi-reality',
      'tvi-ficcao',
      'v-plus-tvi',
      'cnn-portugal',
      'tvi-internacional',
      'sic-noticias'
    ]);
    const workerUrl = wideIptvChannels.has(channelKey)
      ? `https://player-engine.com/api/worker-live/${channelKey}/master.m3u8`
      : `https://tron-ares-iptv.victor-salema-53d.workers.dev/api/iptv/live/${channelKey}/master.m3u8`;
    let HLS_URL = channelName ? workerUrl : '';
    const ALL_TARGET_URLS = HLS_URL ? [HLS_URL] : [];
    const SOURCE_PAGE = 'Cloudflare Worker IPTV autonome';
    const GENERATED_AT = '';
    document.title = channelName ? `Player Worker ${channelName}` : 'Chaine IPTV inconnue';

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const playBtn = document.getElementById('playBtn');
    const urlLabel = document.getElementById('urlLabel');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingLogo = document.getElementById('loadingLogo');
    const loadingLogoBadge = document.getElementById('loadingLogoBadge');
    const loadingProgressFill = document.getElementById('loadingProgressFill');
    const loadingProgressText = document.getElementById('loadingProgressText');
    const playerControls = document.getElementById('playerControls');
    const controlPlay = document.getElementById('controlPlay');
    const controlMute = document.getElementById('controlMute');
    const controlVolume = document.getElementById('controlVolume');
    const controlTime = document.getElementById('controlTime');
    const controlFullscreen = document.getElementById('controlFullscreen');
    let hlsInstance = null;
    let retryTimer = null;
    let retryDelayMs = 3000;
    let loaderProgressTimer = null;
    let lastLoaderProgress = 0;

    window.__CHANNEL_HLS_URL__ = HLS_URL;
    window.__CHANNEL_HLS_URLS__ = ALL_TARGET_URLS;
    window.__CHANNEL_SOURCE_PAGE__ = SOURCE_PAGE;
    window.__CHANNEL_GENERATED_AT__ = GENERATED_AT;

    urlLabel.textContent = HLS_URL || '(aucune URL)';
    video.muted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;
    video.style.objectFit = 'fill';

    function keepNativeControlsVisible() {
      video.controls = true;
      video.setAttribute('controls', '');
      video.disablePictureInPicture = false;
      video.style.pointerEvents = 'auto';
      playerControls.hidden = false;
      updatePlayerControls();
    }

    keepNativeControlsVisible();

    function formatTime(value) {
      const seconds = Math.max(0, Math.floor(Number(value) || 0));
      const minutes = Math.floor(seconds / 60);
      const rest = String(seconds % 60).padStart(2, '0');
      return minutes + ':' + rest;
    }

    function updatePlayerControls() {
      if (!controlPlay) return;
      controlPlay.textContent = video.paused ? 'Lecture' : 'Pause';
      controlMute.textContent = (video.muted || video.volume === 0) ? 'Muet' : 'Son';
      controlVolume.value = String(video.muted ? 0 : video.volume);
      controlTime.textContent = Number.isFinite(video.duration) && video.duration > 0
        ? formatTime(video.currentTime) + ' / ' + formatTime(video.duration)
        : 'Direct';
    }

    async function togglePlayback() {
      if (video.paused) await playWithSound();
      else video.pause();
      updatePlayerControls();
    }

    function toggleMute() {
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) video.volume = 1;
      updatePlayerControls();
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await (video.requestFullscreen ? video.requestFullscreen() : document.documentElement.requestFullscreen());
      } catch (error) {
        console.warn('Plein ecran indisponible:', error);
      }
    }

    controlPlay.addEventListener('click', togglePlayback);
    controlMute.addEventListener('click', toggleMute);
    controlVolume.addEventListener('input', () => {
      video.volume = Number(controlVolume.value);
      video.muted = video.volume === 0;
      updatePlayerControls();
    });
    controlFullscreen.addEventListener('click', toggleFullscreen);
    ['click', 'dblclick', 'pointerdown'].forEach(eventName => {
      playerControls.addEventListener(eventName, event => event.stopPropagation());
    });

    function channelInitials() {
      const label = String(channelName || channelKey || 'TV').replace(/[^a-z0-9+]+/gi, ' ').trim();
      const parts = label.split(/\s+/).filter(Boolean);
      if (!parts.length) return 'TV';
      if (parts.length === 1) return parts[0].slice(0, 4).toUpperCase();
      return parts.slice(0, 3).map(part => part[0]).join('').toUpperCase();
    }

    function setLoaderLogo() {
      const src = channelLogos[channelKey] || '';
      const initials = channelInitials();
      loadingLogoBadge.textContent = initials;
      if (!src) {
        loadingLogo.removeAttribute('src');
        loadingLogo.style.display = 'none';
        loadingLogoBadge.style.display = 'flex';
        return;
      }
      loadingLogoBadge.style.display = 'none';
      loadingLogo.style.display = 'block';
      loadingLogo.alt = channelName || initials;
      loadingLogo.onerror = () => {
        loadingLogo.style.display = 'none';
        loadingLogoBadge.style.display = 'flex';
      };
      loadingLogo.src = src;
    }

    function setLoadingProgress(value, label) {
      const safeValue = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
      lastLoaderProgress = Math.max(lastLoaderProgress, safeValue);
      loadingProgressFill.style.width = lastLoaderProgress + '%';
      loadingProgressText.textContent = (label || 'Chargement du flux') + '... ' + lastLoaderProgress + '%';
    }

    function startLoader(label) {
      loadingOverlay.classList.remove('hidden');
      clearInterval(loaderProgressTimer);
      lastLoaderProgress = 0;
      setLoaderLogo();
      setLoadingProgress(4, label || 'Initialisation');
      loaderProgressTimer = setInterval(() => {
        if (loadingOverlay.classList.contains('hidden')) return;
        if (lastLoaderProgress < 72) setLoadingProgress(lastLoaderProgress + 1, 'Chargement du flux');
      }, 420);
    }

    function hideLoader(label) {
      setLoadingProgress(100, label || 'Flux pret');
      clearInterval(loaderProgressTimer);
      loaderProgressTimer = null;
      setTimeout(() => loadingOverlay.classList.add('hidden'), 180);
    }

    function setMessage(text) { msg.textContent = text; }

    async function playWithSound() {
      keepNativeControlsVisible();
      try {
        video.muted = false;
        video.volume = 1;
        await video.play();
        keepNativeControlsVisible();
        overlay.classList.add('hidden');
        hideLoader('Flux actif');
      } catch (error) {
        hideLoader('Pret a demarrer');
        overlay.classList.remove('hidden');
        setMessage('Lecture automatique avec son bloquée par le navigateur. Clique sur le bouton pour lancer.');
      }
    }

    function scheduleRecovery() {
      if (retryTimer) return;
      const delay = retryDelayMs;
      retryDelayMs = Math.min(retryDelayMs * 2, 30000);
      setMessage('Flux temporairement indisponible. Nouvelle tentative...');
      retryTimer = setTimeout(() => {
        retryTimer = null;
        attachSource(HLS_URL);
      }, delay);
    }

    function attachSource(nextUrl = HLS_URL) {
      keepNativeControlsVisible();
      HLS_URL = String(nextUrl || '');
      window.__CHANNEL_HLS_URL__ = HLS_URL;
      urlLabel.textContent = HLS_URL || '(aucune URL)';
      if (!HLS_URL) {
        hideLoader('Aucune source');
        setMessage('Aucune URL HLS ciblée dans ce fichier.');
        return;
      }
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      startLoader('Connexion HLS');
      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(HLS_URL);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MEDIA_ATTACHED, () => { keepNativeControlsVisible(); setLoadingProgress(58, 'Media attache'); });
        hlsInstance.on(Hls.Events.FRAG_LOADED, () => setLoadingProgress(88, 'Segments video recus'));
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          retryDelayMs = 3000;
          if (retryTimer) {
            clearTimeout(retryTimer);
            retryTimer = null;
          }
          setLoadingProgress(76, 'Manifest charge');
          setMessage('Manifest HLS chargé. Tentative autoplay avec son...');
          playWithSound();
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          console.warn('Erreur HLS:', data);
          if (data && data.fatal) scheduleRecovery();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = HLS_URL;
        setLoadingProgress(58, 'Media natif');
        video.addEventListener('loadedmetadata', () => { setLoadingProgress(95, 'Presque pret'); playWithSound(); }, { once: true });
      } else {
        hideLoader('Erreur lecteur');
        setMessage('HLS.js non chargé ou HLS non supporté par ce navigateur.');
      }
    }

    playBtn.addEventListener('click', playWithSound);
    video.addEventListener('loadedmetadata', () => { keepNativeControlsVisible(); setLoadingProgress(95, 'Presque pret'); });
    video.addEventListener('canplay', () => { keepNativeControlsVisible(); hideLoader('Flux pret'); });
    video.addEventListener('playing', () => { keepNativeControlsVisible(); hideLoader('Flux actif'); });
    video.addEventListener('pause', updatePlayerControls);
    video.addEventListener('volumechange', updatePlayerControls);
    video.addEventListener('timeupdate', updatePlayerControls);
    attachSource();

    console.log('URL HLS ciblée:', HLS_URL);
    console.log('Toutes les URLs ciblées:', ALL_TARGET_URLS.join('\n'));
  </script>
</body>
</html>
