<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benfica TV Player</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.player-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

.player-wrapper iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;

    /* équivalent objet-fit: fill */
    object-fit: fill;
}
</style>
</head>

<body>

<div class="player-wrapper">
    <iframe
        src="https://tv247us.live/embed-s1/cmtv-portugal"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer"
    ></iframe>
</div>
<script>
(function(){

    const BLOCKED_DOMAINS = [
        'chat.cfbu247.sbs',
        'tomompakis.shop',
        'hls-origin.streamserver.io',
        'ts-buffer.livestream.tv',
        'manifest-edge.videocdn.io',
        'media-delivery.cdn.com',
        'chunk-server.streamhub.net'
    ];

    function isBlocked(url){
        try{
            const u = new URL(url, location.href);
            return BLOCKED_DOMAINS.some(domain => u.hostname.includes(domain));
        }catch(e){
            return false;
        }
    }

    const originalFetch = window.fetch;

    window.fetch = function(resource, options){

        const url = typeof resource === 'string'
            ? resource
            : resource?.url;

        if(url && isBlocked(url)){
            console.warn('fetch bloqué:', url);
            return Promise.reject(new Error('Requête bloquée'));
        }

        return originalFetch.apply(this, arguments);
    };

    const originalOpen = XMLHttpRequest.prototype.open;

    XMLHttpRequest.prototype.open = function(method, url){

        if(url && isBlocked(url)){
            console.warn('XHR bloqué:', url);
            this.abort();
            return;
        }

        return originalOpen.apply(this, arguments);
    };

})();

iframe.src = 'about:blank';
iframe.remove();

</script>
</body>
</html>
