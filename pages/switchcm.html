<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(function(){

    const BLOCKED_DOMAINS = [
        'chat.cfbu247.sbs',
        'tomompakis.shop',
        'hls-origin.streamserver.io',
        'ts-buffer.livestream.tv',
        'manifest-edge.videocdn.io',
        'media-delivery.cdn.com',
        'chunk-server.streamhub.net',
        'vidwestxyz.com',
        'youradexchange.com'
    ];

    const BLOCKED_EXTENSIONS = [
        '.mp4'
    ];

    const BLOCKED_PATTERNS = [
        '/video/select.php'
    ];

    function isBlocked(url){

        try{

            const u = new URL(url, location.href);

            const hostname =
                u.hostname.replace(/^www\./,'');

            const pathname =
                u.pathname.toLowerCase();

            const full =
                (u.hostname + u.pathname + u.search)
                .toLowerCase();

            /*
             Blocage domaine
            */
            if(
                BLOCKED_DOMAINS.some(domain =>
                    hostname === domain ||
                    hostname.endsWith('.' + domain)
                )
            ){
                return true;
            }

            /*
             Blocage extension
            */
            if(
                BLOCKED_EXTENSIONS.some(ext =>
                    pathname.endsWith(ext)
                )
            ){
                return true;
            }

            /*
             Blocage pattern URL
            */
            if(
                BLOCKED_PATTERNS.some(pattern =>
                    full.includes(pattern)
                )
            ){
                return true;
            }

            return false;

        }catch(e){
            return false;
        }
    }

    /*
     FETCH
    */
    const originalFetch = window.fetch;

    window.fetch = function(resource, options){

        const url =
            typeof resource === 'string'
            ? resource
            : resource?.url;

        if(url && isBlocked(url)){

            console.warn('FETCH BLOQUÉ:', url);

            return Promise.reject(
                new Error('Blocked request')
            );
        }

        return originalFetch.apply(this, arguments);
    };

    /*
     XHR
    */
    const originalOpen =
        XMLHttpRequest.prototype.open;

    XMLHttpRequest.prototype.open = function(
        method,
        url
    ){

        if(url && isBlocked(url)){

            console.warn('XHR BLOQUÉ:', url);

            this.abort();

            return;
        }

        return originalOpen.apply(this, arguments);
    };

    /*
     setAttribute
    */
    const originalSetAttribute =
        Element.prototype.setAttribute;

    Element.prototype.setAttribute =
    function(name, value){

        if(
            ['src','href'].includes(
                String(name).toLowerCase()
            ) &&
            typeof value === 'string' &&
            isBlocked(value)
        ){

            console.warn(
                'ATTRIBUT BLOQUÉ:',
                value
            );

            return;
        }

        return originalSetAttribute.apply(
            this,
            arguments
        );
    };

    /*
     Nettoyage DOM
    */
    function cleanBlockedElements(){

        const selectors = [
            'iframe',
            'video',
            'source',
            'img',
            'script',
            'link'
        ];

        selectors.forEach(selector => {

            document
            .querySelectorAll(selector)
            .forEach(el => {

                const src =
                    el.src ||
                    el.href ||
                    el.getAttribute('src') ||
                    el.getAttribute('href');

                if(src && isBlocked(src)){

                    console.warn(
                        'ÉLÉMENT SUPPRIMÉ:',
                        src
                    );

                    try{

                        if(el.tagName === 'VIDEO'){

                            el.pause();

                            el.removeAttribute('src');

                            el.load();
                        }

                    }catch(e){}

                    el.remove();
                }
            });
        });
    }

    /*
     Observer DOM
    */
    const observer = new MutationObserver(() => {
        cleanBlockedElements();
    });

    observer.observe(document.documentElement, {
        childList:true,
        subtree:true,
        attributes:true,
        attributeFilter:['src','href']
    });

    /*
     Scan périodique
    */
    setInterval(cleanBlockedElements, 1000);

    console.log('Anti-pub actif');

})();


iframe.src = 'about:blank';
iframe.remove();

</script>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#wrap{
    position:fixed;
    inset:0;
}

iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

#switchButton{
    position:fixed;
    top:12px;
    right:12px;
    z-index:9999;
    width:48px;
    height:48px;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    cursor:pointer;
}
</style>
</head>

<body>

<div id="wrap"></div>

<button id="switchButton">

</button>

<script>
const IFRAME_1_URL = 'https://player-engine.com/pages/cmtv-tv247';
const IFRAME_2_URL = 'https://player-engine.com/pages/cmtv2.html';

const wrap = document.getElementById('wrap');

let currentFrame = null;
let currentIndex = 1;

function createFrame(url){

    const iframe = document.createElement('iframe');

    iframe.allow =
        'autoplay; fullscreen; picture-in-picture; encrypted-media';

    iframe.allowFullscreen = true;

    iframe.referrerPolicy =
        'strict-origin-when-cross-origin';

    iframe.sandbox =
        'allow-scripts allow-same-origin allow-forms allow-presentation allow-popups';

    iframe.src = url;

    return iframe;
}

function destroyFrame(frame){

    if(!frame) return;

    try{

        /*
         Stop immédiat audio/video
        */
        frame.src = 'about:blank';

    }catch(e){}

    /*
     Retire du DOM
    */
    frame.remove();
}

function loadFrame(index){

    /*
     Détruit totalement l'ancienne iframe
    */
    destroyFrame(currentFrame);

    /*
     Choisit URL
    */
    const url =
        index === 1
        ? IFRAME_1_URL
        : IFRAME_2_URL;

    /*
     Crée nouvelle iframe
    */
    currentFrame = createFrame(url);

    /*
     Ajoute au DOM
    */
    wrap.appendChild(currentFrame);

    currentIndex = index;
}

/*
 Chargement initial
*/
loadFrame(1);

/*
 Switch
*/
document
.getElementById('switchButton')
.addEventListener('click',()=>{

    if(currentIndex === 1){

        loadFrame(2);

    }else{

        loadFrame(1);
    }
});
</script>

</body>
</html>
