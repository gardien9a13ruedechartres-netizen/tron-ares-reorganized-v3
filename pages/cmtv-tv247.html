<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benfica TV Player</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.player-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

.player-wrapper iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;

    /* équivalent objet-fit: fill */
    object-fit: fill;
}
</style>
</head>

<body>

<div class="player-wrapper">
    <iframe
        src="https://tv247us.live/embed-s1/cmtv-portugal"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer"
    ></iframe>
</div>

</body>
</html>
