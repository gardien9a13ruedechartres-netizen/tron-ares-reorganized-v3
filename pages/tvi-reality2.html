<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#video{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:fill;
}
</style>

</head>

<body>

<video
id="video"
poster=""
controls
playsinline
autoplay
muted>
</video>
<script>
        if(Hls.isSupported()) {
          var video = document.getElementById('video');
          var hls = new Hls({
              debug: true,
			  enableWorker: true,
			  lowLatencyMode: true,
			  backBufferLength: 90
          });
          hls.loadSource('https://video-auth6.iol.pt/live_tvi_reality/live_tvi_reality/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9NS8yNS8yMDI2IDY6NDk6NDYgUE0maGFzaF92YWx1ZT1lc2w0bWZ0eUVPWWhjMUhNeGJsc1hBPT0mdmFsaWRtaW51dGVzPTE0NDAmaWQ9NzM4MmJmZTgtZDMzYS00MGE4LWExMjQtN2EwY2U3YjFmNTJk');
          hls.attachMedia(video);
          hls.on(Hls.Events.MEDIA_ATTACHED, function() {
            video.muted = false;
            video.play();
        });
       }
       // hls.js is not supported on platforms that do not have Media Source Extensions (MSE) enabled.
       // When the browser has built-in HLS support (check using `canPlayType`), we can provide an HLS manifest (i.e. .m3u8 URL) directly to the video element throught the `src` property.
       // This is using the built-in support of the plain video element, without using hls.js.
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = 'https://video-auth6.iol.pt/live_tvi_reality/live_tvi_reality/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9NS8yNS8yMDI2IDY6NDk6NDYgUE0maGFzaF92YWx1ZT1lc2w0bWZ0eUVPWWhjMUhNeGJsc1hBPT0mdmFsaWRtaW51dGVzPTE0NDAmaWQ9NzM4MmJmZTgtZDMzYS00MGE4LWExMjQtN2EwY2U3YjFmNTJk';
          video.addEventListener('canplay',function() {
            video.play();
          });
        }
      </script>

</body>
</html>
