<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Player Worker CMTVPT</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      opacity: 1;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      background: transparent;
      opacity: 0;
      transition: opacity .12s linear;
    }

    video.ready {
      opacity: 1;
    }

    #overlay {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      font-family: Arial, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 12px;
      line-height: 1.4;
      visibility: hidden;
      pointer-events: none;
    }

    #overlay.hidden {
      display: none;
    }

    button {
      margin-top: 8px;
      padding: 10px 14px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
    }

    code {
      word-break: break-all;
      color: #d7f7ff;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay  playsinline webkit-playsinline preload="auto"></video>

  <div id="overlay">
    <div><strong>Player HLS généré</strong></div>
    <div hidden>URL ciblée : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="playBtn">Activer lecture avec son</button>
  </div>

  <script type="application/json" id="hls-data">{"url":"https://player-engine.com/api/worker-live/cmtvpt/master.m3u8","upstreamUrl":"","urls":["https://player-engine.com/api/worker-live/cmtvpt/master.m3u8"],"sourcePage":"Cloudflare Worker autonome","generatedAt":"2026-06-28T07:16:09.692Z"}</script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  <script>
    const dataNode = document.getElementById('hls-data');
    const HLS_DATA = JSON.parse(dataNode.textContent || '{}');
    let HLS_URL = String(HLS_DATA.url || '');
    const ALL_TARGET_URLS = Array.isArray(HLS_DATA.urls) ? HLS_DATA.urls : [];
    const SOURCE_PAGE = String(HLS_DATA.sourcePage || '');
    const GENERATED_AT = String(HLS_DATA.generatedAt || '');

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const playBtn = document.getElementById('playBtn');
    const urlLabel = document.getElementById('urlLabel');

    let hlsInstance = null;
    let retryTimer = null;
    let retryDelayMs = 1200;
    let firstFrameShown = false;

    window.__CHANNEL_HLS_URL__ = HLS_URL;
    window.__CHANNEL_HLS_URLS__ = ALL_TARGET_URLS;
    window.__CHANNEL_SOURCE_PAGE__ = SOURCE_PAGE;
    window.__CHANNEL_GENERATED_AT__ = GENERATED_AT;

    urlLabel.textContent = HLS_URL || '(aucune URL)';

    video.muted = false;
    video.defaultMuted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.style.objectFit = 'fill';

    function setMessage(text) {
      msg.textContent = text;
    }

    function showFirstFrame() {
      if (firstFrameShown) return;
      firstFrameShown = true;
      video.classList.add('ready');
      overlay.classList.add('hidden');
    }

    async function startMutedInstant() {
      try {
        video.muted = true;
        video.defaultMuted = false;
        await video.play();
      } catch (error) {
        setMessage('Lecture automatique bloquée par le navigateur.');
      }
    }

    async function playWithSound() {
      try {
        video.muted = false;
        video.defaultMuted = false;
        video.volume = 1;
        await video.play();
        overlay.classList.add('hidden');
      } catch (error) {
        video.muted = false;
        video.defaultMuted = false;
        await startMutedInstant();
      }
    }

    function resetVideoVisualState() {
      firstFrameShown = false;
      video.classList.remove('ready');
    }

    function scheduleRecovery() {
      if (retryTimer) return;
      const delay = retryDelayMs;
      retryDelayMs = Math.min(retryDelayMs * 2, 10000);
      setMessage('Flux temporairement indisponible. Nouvelle tentative...');
      retryTimer = setTimeout(() => {
        retryTimer = null;
        attachSource(HLS_URL);
      }, delay);
    }

    function bindFirstFrameEvents() {
      video.addEventListener('loadeddata', showFirstFrame, { once: true });
      video.addEventListener('canplay', showFirstFrame, { once: true });
      video.addEventListener('playing', showFirstFrame, { once: true });
      video.addEventListener('timeupdate', showFirstFrame, { once: true });
    }

    function attachSource(nextUrl = HLS_URL) {
      HLS_URL = String(nextUrl || '');
      window.__CHANNEL_HLS_URL__ = HLS_URL;
      urlLabel.textContent = HLS_URL || '(aucune URL)';

      if (!HLS_URL) {
        setMessage('Aucune URL HLS ciblée dans ce fichier.');
        return;
      }

      if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }

      resetVideoVisualState();
      bindFirstFrameEvents();

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          startPosition: -1,
          maxBufferLength: 8,
          maxMaxBufferLength: 12,
          liveSyncDurationCount: 1,
          liveMaxLatencyDurationCount: 3,
          maxLiveSyncPlaybackRate: 1.5,
          manifestLoadingMaxRetry: 6,
          manifestLoadingRetryDelay: 500,
          levelLoadingMaxRetry: 6,
          levelLoadingRetryDelay: 500,
          fragLoadingMaxRetry: 6,
          fragLoadingRetryDelay: 500
        });

        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MEDIA_ATTACHED, () => {
          hlsInstance.loadSource(HLS_URL);
        });

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          retryDelayMs = 1200;
          setMessage('Manifest HLS chargé. Lecture instantanée...');
          startMutedInstant();
        });

        hlsInstance.on(Hls.Events.FRAG_BUFFERED, () => {
          startMutedInstant();
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          console.warn('Erreur HLS:', data);
          if (!data) return;

          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hlsInstance.startLoad(-1);
              scheduleRecovery();
              return;
            }

            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hlsInstance.recoverMediaError();
              return;
            }

            scheduleRecovery();
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = HLS_URL;
        video.load();
        video.addEventListener('loadedmetadata', startMutedInstant, { once: true });
      } else {
        setMessage('HLS.js non chargé ou HLS non supporté par ce navigateur.');
      }
    }

    async function refreshPublishedSource() {
      if (!/^https?:$/.test(location.protocol)) return;

      try {
        const refreshUrl = new URL(location.href);
        refreshUrl.searchParams.set('_hls_refresh', String(Date.now()));
        const response = await fetch(refreshUrl, { cache: 'no-store' });
        if (!response.ok) return;

        const nextDocument = new DOMParser().parseFromString(await response.text(), 'text/html');
        const nextDataNode = nextDocument.getElementById('hls-data');
        if (!nextDataNode) return;

        const nextData = JSON.parse(nextDataNode.textContent || '{}');
        const nextUrl = String(nextData.url || '');

        if (nextUrl && nextUrl !== HLS_URL) {
          setMessage('Nouveau master détecté. Mise à jour du flux...');
          attachSource(nextUrl);
        }
      } catch (error) {
        console.warn('Vérification du nouveau master impossible:', error);
      }
    }

    playBtn.addEventListener('click', playWithSound);

    document.addEventListener('click', playWithSound, { once: true });
    document.addEventListener('touchstart', playWithSound, { once: true, passive: true });

    attachSource();
    setInterval(refreshPublishedSource, 20000);

    console.log('URL HLS ciblée:', HLS_URL);
    console.log('Toutes les URLs ciblées:', ALL_TARGET_URLS.join('\n'));
  </script>
</body>
</html>
