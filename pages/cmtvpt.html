<!doctype html>

  <title>Player HLS CMTVPT</title>
  <style>
    html, body {
      width: 100%;

    video {
      position: fixed;

    }
    #overlay {
      position: fixed;
      left: 12px;

      z-index: 10;
      font-family: Arial, sans-serif;

      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;

    }
    #overlay.hidden { display: none; }

    button {

<body>
  <video id="video" controls autoplay muted playsinline webkit-playsinline preload="auto"></video>
  <div id="overlay">
    <div><strong>Player HLS CMTVPT</strong></div>
    <div>URL ciblée : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="soundBtn">Démarrer / activer le son</button>
  </div>

  <script type="application/json" id="hls-data">{"url":"https://clouding.wideiptv.top/CMTVPT/index.fmp4.m3u8?token=a0b9f455ceebf327c355bafa7ee03f3828c72b3b-cff217969599e9f338b14316e20b2a6f-1782423128-1782419528","urls":["https://clouding.wideiptv.top/CMTVPT/index.fmp4.m3u8?token=a0b9f455ceebf327c355bafa7ee03f3828c72b3b-cff217969599e9f338b14316e20b2a6f-1782423128-1782419528"],"sourcePage":"https://gardien9a13ruedechartres-netizen.github.io/cmtv-chrome/","generatedAt":"2026-06-25T20:37:12.057Z"}</script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    (function () {
      'use strict';

      const dataNode = document.getElementById('hls-data');
      const HLS_DATA = JSON.parse(dataNode.textContent || '{}');
      const HLS_URL = String(HLS_DATA.url || '');
      const ALL_TARGET_URLS = Array.isArray(HLS_DATA.urls) ? HLS_DATA.urls : [];
      const SOURCE_PAGE = String(HLS_DATA.sourcePage || '');
      const GENERATED_AT = String(HLS_DATA.generatedAt || '');

      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');
      const msg = document.getElementById('msg');
      const soundBtn = document.getElementById('soundBtn');
      const urlLabel = document.getElementById('urlLabel');

      let sourceAttached = false;

      window.__CMTVPT_HLS_URL__ = HLS_URL;
      window.__CMTVPT_HLS_URLS__ = ALL_TARGET_URLS;
      window.__CMTVPT_SOURCE_PAGE__ = SOURCE_PAGE;
      window.__CMTVPT_GENERATED_AT__ = GENERATED_AT;

      urlLabel.textContent = HLS_URL || '(aucune URL)';
      video.autoplay = true;
      video.muted = true;
      video.defaultMuted = true;
      video.volume = 1;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.style.objectFit = 'fill';

      function setMessage(text) { msg.textContent = text; }
      function showOverlay(text) {
        if (text) setMessage(text);
        overlay.classList.remove('hidden');
      }
      function hideOverlay() { overlay.classList.add('hidden'); }

      async function tryPlayMuted() {
        try {
          video.muted = true;
          video.defaultMuted = true;
          await video.play();
          showOverlay('Lecture démarrée en mode muet. Touche le bouton pour activer le son sur smartphone.');
          return true;
        } catch (error) {
          showOverlay('Le navigateur mobile bloque le démarrage automatique. Touche le bouton pour lancer la lecture.');
          console.warn('Autoplay mobile refusé:', error);
          return false;
        }
      }

      async function enableSoundFromUserGesture() {
        try {
          video.muted = false;
          video.defaultMuted = false;
          video.volume = 1;
          await video.play();
          hideOverlay();
        } catch (error) {
          showOverlay('Lecture avec son refusée. Retouche le bouton ou vérifie les autorisations du navigateur.');
          console.warn('Lecture avec son refusée:', error);
        }
      }

      function attachSource() {
        if (sourceAttached) return;
        sourceAttached = true;

        if (!HLS_URL) {
          showOverlay('Aucune URL HLS ciblée dans ce fichier.');
          return;
        }

        // Smartphone / iPhone : priorité au HLS natif Safari.
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = HLS_URL;
          video.addEventListener('loadedmetadata', tryPlayMuted, { once: true });
          video.addEventListener('canplay', tryPlayMuted, { once: true });
          video.load();
          setMessage('Source HLS native chargée. Tentative autoplay mobile en muet...');
          return;
        }

        // Android / Chrome / navigateurs sans HLS natif : hls.js.
        if (window.Hls && Hls.isSupported()) {
          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 30
          });
          hls.loadSource(HLS_URL);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            setMessage('Manifest HLS chargé. Tentative autoplay mobile en muet...');
            tryPlayMuted();
          });
          hls.on(Hls.Events.ERROR, function (event, data) {
            console.warn('Erreur HLS:', data);
            if (data && data.fatal) {
              showOverlay('Erreur HLS fatale. L’URL peut être expirée, bloquée CORS, ou inaccessible depuis ce navigateur.');
            }
          });
          return;
        }

        showOverlay('HLS non supporté par ce navigateur et hls.js indisponible.');
      }

      soundBtn.addEventListener('click', enableSoundFromUserGesture);
      document.addEventListener('touchend', function onceTouch() {
        document.removeEventListener('touchend', onceTouch);
        if (video.paused) tryPlayMuted();
      }, { once: true, passive: true });

      video.addEventListener('playing', function () {
        if (!video.muted) hideOverlay();
      });

      attachSource();

      console.log('URL HLS ciblée:', HLS_URL);
      console.log('Toutes les URLs ciblées:', ALL_TARGET_URLS.join('\n'));
    })();
  </script>
</body>
</html>
