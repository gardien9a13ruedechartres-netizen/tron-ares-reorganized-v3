<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Player HLS CMTVPT</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      touch-action: manipulation;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 100%;
      object-fit: fill;
      background: #000;
    }
    #overlay {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 10;
      font-family: Arial, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.68);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      padding: 12px;
      line-height: 1.4;
      font-size: clamp(13px, 3.5vw, 15px);
      max-height: 42dvh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    #overlay.hidden { display: none; }
    button {
      margin-top: 10px;
      min-height: 44px;
      padding: 11px 14px;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      touch-action: manipulation;
    }
    code { word-break: break-word; overflow-wrap: anywhere; color: #d7f7ff; }
    @media (orientation: landscape) and (max-height: 520px) {
      #overlay { font-size: 12px; max-height: 55dvh; padding: 10px; }
      button { min-height: 40px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
  <div id="overlay">
    <div><strong>Player HLS généré</strong></div>
    <div>URL ciblée : <code id="urlLabel"></code></div>
    <div id="msg">Chargement du player...</div>
    <button id="playBtn">Activer lecture avec son</button>
  </div>

  <script type="application/json" id="hls-data">{"url":"https://clouding.wideiptv.top/CMTVPT/index.fmp4.m3u8?token=28b790533898718b4069f331a418e2d8ed4bc25b-dd2703bce96d6b738fe871cd5c1431c6-1782424524-1782420924","urls":["https://clouding.wideiptv.top/CMTVPT/index.fmp4.m3u8?token=28b790533898718b4069f331a418e2d8ed4bc25b-dd2703bce96d6b738fe871cd5c1431c6-1782424524-1782420924"],"sourcePage":"https://gardien9a13ruedechartres-netizen.github.io/cmtv-chrome/","generatedAt":"2026-06-25T21:00:28.552Z"}</script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const dataNode = document.getElementById('hls-data');
    const HLS_DATA = JSON.parse(dataNode.textContent || '{}');
    const HLS_URL = String(HLS_DATA.url || '');
    const ALL_TARGET_URLS = Array.isArray(HLS_DATA.urls) ? HLS_DATA.urls : [];
    const SOURCE_PAGE = String(HLS_DATA.sourcePage || '');
    const GENERATED_AT = String(HLS_DATA.generatedAt || '');

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const playBtn = document.getElementById('playBtn');
    const urlLabel = document.getElementById('urlLabel');

    window.__CMTVPT_HLS_URL__ = HLS_URL;
    window.__CMTVPT_HLS_URLS__ = ALL_TARGET_URLS;
    window.__CMTVPT_SOURCE_PAGE__ = SOURCE_PAGE;
    window.__CMTVPT_GENERATED_AT__ = GENERATED_AT;

    urlLabel.textContent = HLS_URL || '(aucune URL)';
    video.muted = false;
    video.volume = 1;
    video.autoplay = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.style.objectFit = 'fill';

    function setMessage(text) { msg.textContent = text; }

    async function playWithSound() {
      try {
        video.muted = false;
        video.volume = 1;
        await video.play();
        overlay.classList.add('hidden');
      } catch (error) {
        overlay.classList.remove('hidden');
        setMessage('Lecture automatique avec son bloquée par le navigateur. Clique sur le bouton pour lancer.');
      }
    }

    function attachSource() {
      if (!HLS_URL) {
        setMessage('Aucune URL HLS ciblée dans ce fichier.');
        return;
      }
      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(HLS_URL);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setMessage('Manifest HLS chargé. Tentative autoplay avec son...');
          playWithSound();
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.warn('Erreur HLS:', data);
          if (data && data.fatal) setMessage('Erreur HLS fatale. Vérifie que l’URL est encore valide et autorise la lecture depuis ce fichier HTML.');
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = HLS_URL;
        video.addEventListener('loadedmetadata', playWithSound, { once: true });
      } else {
        setMessage('HLS.js non chargé ou HLS non supporté par ce navigateur.');
      }
    }

    playBtn.addEventListener('click', playWithSound);
    video.addEventListener('click', playWithSound);
    video.addEventListener('touchend', playWithSound, { passive: true });
    attachSource();

    console.log('URL HLS ciblée:', HLS_URL);
    console.log('Toutes les URLs ciblées:', ALL_TARGET_URLS.join('\n'));
  </script>
</body>
</html>
